version: 2
# Group minor/patch updates per ecosystem so CI (especially the ~30 min
# mobile Android/iOS jobs) runs once per batch instead of once per package.
# Keep unrelated major bumps as individual PRs — they often need code changes.
# Expo and ASP.NET Core families stay grouped even on majors because those
# packages are meant to move together.
# Do not use multi-ecosystem-groups: a mixed nuget+npm PR would run both
# the .NET suite and the native mobile builds (see scripts/classify-pipeline-changes.sh).
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      aspnetcore:
        applies-to: version-updates
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.EntityFrameworkCore.*"
          - "Microsoft.Extensions.*"
      nuget-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      nuget-security-minor-patch:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/src/QueenZone.Mobile"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      expo-sdk:
        applies-to: version-updates
        patterns:
          - "expo"
          - "expo-*"
          - "babel-preset-expo"
          - "jest-expo"
      mobile-npm-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          # 4.6.0 peers worklets 0.12.x; Expo 57 stays on worklets 0.10.1.
          - "react-native-reanimated"
          # Expo 57 pins; 19.2.8 also fights react-test-renderer / react-dom 19.2.3 overrides.
          - "react"
          # Expo 57 pin; RN majors peer-break reanimated 4.5.1 / worklets 0.10.1.
          - "react-native"
          - "react-native-safe-area-context"
          - "react-native-screens"
          - "react-native-svg"
          # Expo 57 / reanimated 4.5.1 stay on worklets 0.10.1; newer worklets peer-break that pin.
          - "react-native-worklets"
          # Expo 57 expo-doctor rejected 7.13.0 on #1259; keep ~7.11.0 until Expo 58.
          - "@sentry/react-native"
        update-types:
          - "minor"
          - "patch"
      mobile-npm-security-minor-patch:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      github-actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      github-actions-security-minor-patch:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
