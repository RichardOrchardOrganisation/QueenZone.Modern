version: 2
# Group minor/patch updates per ecosystem so CI (especially the ~30 min
# mobile Android/iOS jobs) runs once per batch instead of once per package.
# Keep unrelated major bumps as individual PRs — they often need code changes.
# ASP.NET Core family stays grouped even on majors because those packages
# are meant to move together. Expo SDK majors and SDK-pinned natives are
# manual via `npx expo install --fix` under #1782 (see the mobile npm ignore).
# Do not use multi-ecosystem-groups: a mixed nuget+npm PR would run both
# the .NET suite and the native mobile builds (see scripts/classify-pipeline-changes.sh).
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      aspnetcore:
        applies-to: version-updates
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.EntityFrameworkCore.*"
          - "Microsoft.Extensions.*"
      nuget-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      nuget-security-minor-patch:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/src/QueenZone.Mobile"
    # Expo SDK majors and SDK-pinned natives are manual via
    # `npx expo install --fix` under #1782. This ignore list mirrors
    # expo@58.0.14 bundledNativeModules.json (exact vs ~ split from that
    # file, not memory) and is revisited at each SDK upgrade.
    #
    # Every ignore uses update-types to block only ordinary version updates.
    # Security PRs remain eligible and require SDK compatibility review.
    # GitHub documents that update-types do not apply to security updates:
    # https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/controlling-dependencies-updated#allowing-specific-semantic-versioning-levels-for-updates
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    ignore:
      # Expo family: in-SDK patches and minors still flow through expo-sdk.
      - dependency-name: "expo" # SDK 58 pin: ~58.0.14
        update-types:
          - "version-update:semver-major"
      - dependency-name: "expo-*" # SDK 58 family (bundledNativeModules ~58.x)
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@expo/*" # SDK 58 family (e.g. @expo/ui ~58.0.20)
        update-types:
          - "version-update:semver-major"
      - dependency-name: "babel-preset-expo" # SDK 58 pin: ~58.0.0
        update-types:
          - "version-update:semver-major"
      - dependency-name: "jest-expo" # SDK 58 pin: ~58.0.11
        update-types:
          - "version-update:semver-major"
      - dependency-name: "eslint-config-expo" # SDK 58 pin: ~58.0.4
        update-types:
          - "version-update:semver-major"
      # Exact bundledNativeModules pins: ignore all version updates.
      - dependency-name: "@react-native-async-storage/async-storage" # SDK 58 pin: 2.2.0
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "react" # SDK 58 pin: 19.3.0
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "react-native" # SDK 58 pin: 0.88.0
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "react-native-reanimated" # SDK 58 pin: 4.7.1
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "react-native-svg" # SDK 58 pin: 15.16.0
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "react-native-worklets" # SDK 58 pin: 0.13.0
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      # Tilde bundledNativeModules pins: ignore major and minor; patches still come.
      # @sentry/react-native is not ignored: SDK 58 bundles ~8.28.0.
      # PR 2 of #1782 removed expo.install.exclude; Dependabot may propose patches.
      # Do not re-add a 7.x ignore.
      - dependency-name: "react-native-gesture-handler" # SDK 58 pin: ~3.3.0
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "react-native-safe-area-context" # SDK 58 pin: ~5.10.1
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "react-native-screens" # SDK 58 pin: ~4.30.0
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    groups:
      expo-sdk:
        applies-to: version-updates
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
          - "babel-preset-expo"
          - "jest-expo"
          - "eslint-config-expo"
      mobile-npm-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      mobile-npm-security-minor-patch:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      github-actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      github-actions-security-minor-patch:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
