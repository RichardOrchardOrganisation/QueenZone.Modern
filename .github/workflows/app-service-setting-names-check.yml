name: App Service setting names check

on:
  schedule:
    # 07:00 UTC daily — offset from the other nightly Azure/DB jobs.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-service-setting-names-check
  cancel-in-progress: false

# Scope item 5 of #618 (ADR 0008, docs/decisions/0008-app-service-settings-ownership.md):
# detect a missing required App Service setting *name* on queenzone-prod without
# OpenTofu (or this workflow) ever reading or printing a value. The required
# name list lives in infra/import/github-bitwarden.json's appServiceSettingNames
# array, alongside the rest of the #624 sanitised inventory. Only names are
# fetched (`az webapp config appsettings list --query "[].name"`) and only
# names are compared — see scripts/Test-AppServiceSettingNames.ps1.
#
# Read-only: this workflow never calls `az webapp config appsettings set`.
jobs:
  check-setting-names:
    name: Verify required setting names are present
    runs-on: ubuntu-latest
    # Production ARM/OIDC identity (issue #1377 Option B). Custom policy:
    # branch main + tags v*. Scheduled runs use the default branch (main).
    environment: prod-deploy
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: Check required App Service setting names are present
        shell: pwsh
        run: ./scripts/Test-AppServiceSettingNames.ps1
