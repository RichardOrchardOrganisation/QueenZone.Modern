name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.check.outputs.code }}
      migrations: ${{ steps.check.outputs.migrations }}
      mobile: ${{ steps.check.outputs.mobile }}
      mobile_native: ${{ steps.check.outputs.mobile_native }}
      mobile_api_contracts: ${{ steps.check.outputs.mobile_api_contracts }}
      design_tokens: ${{ steps.check.outputs.design_tokens }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Self-test change classifier
        run: bash ./scripts/classify-pipeline-changes.sh --self-test
      - name: Check for code changes
        id: check
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> $GITHUB_OUTPUT
            echo "migrations=true" >> $GITHUB_OUTPUT
            echo "mobile=true" >> $GITHUB_OUTPUT
            echo "mobile_native=true" >> $GITHUB_OUTPUT
            echo "mobile_api_contracts=true" >> $GITHUB_OUTPUT
            echo "design_tokens=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          git diff --name-only origin/main...HEAD \
            | bash ./scripts/classify-pipeline-changes.sh \
            >> "$GITHUB_OUTPUT"

  # JS preflight + coverage gate for src/QueenZone.Mobile (#871 Option A).
  # After npm ci --no-audit: #837 advisory gate, typecheck, lint, discovered unit tests with
  # coverage, pinned Expo Doctor, then the documented mobile coverage floors.
  # Native Android/iOS compile builds run in mobile-android/mobile-ios below.
  # Mixed web+mobile PRs run this alongside the .NET suite; mobile-only PRs
  # skip the website path entirely. Required on main after #870 — see
  # mobile-js-ok stubs.
  mobile-js:
    name: Mobile typecheck and unit tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    defaults:
      run:
        working-directory: src/QueenZone.Mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Self-test mobile coverage gate
        working-directory: ${{ github.workspace }}
        run: node scripts/Test-MobileCoverageGate.mjs --self-test

      - name: Self-test npm advisory gate
        working-directory: ${{ github.workspace }}
        run: node src/QueenZone.Mobile/scripts/check-npm-advisories.mjs --self-test

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/QueenZone.Mobile/package-lock.json

      - name: Install
        # Skip npm ci's implicit audit. A second `npm audit --json` in the
        # next step was hanging until the 300s fetch-timeout (#1309 CI).
        run: npm ci --no-audit

      - name: Enforce npm advisory policy
        run: node scripts/check-npm-advisories.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests with coverage
        id: mobile-coverage-collect
        run: npm run test:coverage

      - name: Enforce mobile coverage gate
        working-directory: ${{ github.workspace }}
        run: node scripts/Test-MobileCoverageGate.mjs

      - name: Expo Doctor
        run: npm run doctor

      - name: Upload mobile coverage (machine-readable)
        if: always() && steps.mobile-coverage-collect.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: mobile-coverage-${{ github.run_id }}
          path: |
            src/QueenZone.Mobile/coverage/merged/coverage.cobertura.xml
            src/QueenZone.Mobile/coverage/merged/summary.json
            src/QueenZone.Mobile/coverage/jest/coverage-summary.json
            src/QueenZone.Mobile/coverage/node/lcov.info
          retention-days: 3
          if-no-files-found: error

      - name: Upload mobile coverage HTML
        if: always() && steps.mobile-coverage-collect.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: mobile-coverage-html-${{ github.run_id }}
          path: src/QueenZone.Mobile/coverage/merged/html
          retention-days: 1
          if-no-files-found: error

  # Unsigned Android debug APK from CNG-generated native project (issue #794).
  # No keystore secrets: Gradle's default debug signing config is fine for a
  # sideload-test build. ADR 0011 defers real signing/store credentials.
  mobile-android:
    name: Mobile Android build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.mobile_native == 'true'
    defaults:
      run:
        working-directory: src/QueenZone.Mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/QueenZone.Mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install
        run: npm ci

      - name: Prebuild Android project
        run: npx expo prebuild --platform android

      # Restores Gradle dependencies and local build-cache entries, and adds
      # cache/task diagnostics to the job summary. This covers more than the
      # previous direct ~/.gradle cache and makes misses visible.
      - name: Setup Gradle caching and diagnostics
        uses: gradle/actions/setup-gradle@v4

      # Unsigned CI builds must not call sentry-cli upload (no org/token here).
      # Publish workflows set SENTRY_ORG/PROJECT/AUTH_TOKEN and upload for real.
      - name: Assemble debug APK
        working-directory: src/QueenZone.Mobile/android
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: mobile-android-${{ github.run_id }}
          path: src/QueenZone.Mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
          if-no-files-found: error

  # Prefer the dedicated local Mac for the unsigned Simulator build when it is
  # online and idle. GitHub has no native self-hosted/hosted runs-on fallback,
  # so this cheap hosted probe fails open to macos-26 (issue #893).
  mobile-ios-runner:
    name: Choose iOS runner
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.mobile_native == 'true'
    outputs:
      runs_on: ${{ steps.pick.outputs.runs_on }}
      runner_class: ${{ steps.pick.outputs.runner_class }}
    steps:
      - name: Fetch runner-list token
        id: bitwarden-secrets
        continue-on-error: true
        uses: bitwarden/sm-action@v3.0.1
        with:
          access_token: ${{ secrets.BITWARDEN_SECRETS_MANAGER_ACCESS_TOKEN }}
          secrets: ${{ vars.BITWARDEN_IOS_RUNNER_SECRETS }}

      - name: Prefer an idle iOS build runner
        id: pick
        env:
          GH_TOKEN: ${{ steps.bitwarden-secrets.outputs.IOS_RUNNER_ADMIN_TOKEN }}
        run: |
          set +e
          hosted='["macos-26"]'
          self_hosted='["self-hosted","macOS","ARM64","ios-build"]'

          echo "runs_on=$hosted" >> "$GITHUB_OUTPUT"
          echo "runner_class=github-hosted macos-26" >> "$GITHUB_OUTPUT"

          if [ -z "$GH_TOKEN" ]; then
            echo "Runner-list token is unavailable; using GitHub-hosted macos-26."
            exit 0
          fi

          response=$(gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/runners?per_page=100" 2>/dev/null)
          if [ $? -ne 0 ] || [ -z "$response" ]; then
            echo "Runner status could not be read; using GitHub-hosted macos-26."
            exit 0
          fi

          available=$(jq -s 'any(.[].runners[]?;
            .status == "online" and .busy == false and
            ([.labels[].name] | contains(["self-hosted", "macOS", "ARM64", "ios-build"])))' \
            <<< "$response" 2>/dev/null)
          if [ "$available" = "true" ]; then
            echo "runs_on=$self_hosted" >> "$GITHUB_OUTPUT"
            echo "runner_class=self-hosted ios-build" >> "$GITHUB_OUTPUT"
            echo "An online, idle ios-build runner is available."
          else
            echo "No online, idle ios-build runner is available; using GitHub-hosted macos-26."
          fi

  # Unsigned iOS Simulator build from CNG-generated native project (issues
  # #794 and #893). No signing identity or Apple credential is needed.
  mobile-ios:
    name: Mobile iOS build
    runs-on: ${{ fromJSON(needs.mobile-ios-runner.outputs.runs_on) }}
    needs: [changes, mobile-ios-runner]
    if: needs.changes.outputs.mobile_native == 'true'
    defaults:
      run:
        working-directory: src/QueenZone.Mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure self-hosted tool paths
        if: runner.environment == 'self-hosted'
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/sbin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"

      # Expo SDK 57 requires Xcode 26.4+ (docs/mobile-development-environment.md);
      # the runner's default DEVELOPER_DIR can be an older Xcode also installed
      # on the image. Select the newest one actually present rather than
      # hardcoding a version that may not match what GitHub ships on this
      # runner generation.
      - name: Select latest available Xcode
        run: |
          ls /Applications | grep -i Xcode
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$LATEST" ] && [ -d /Applications/Xcode.app ]; then
            LATEST=/Applications/Xcode.app
          fi
          if [ -z "$LATEST" ]; then
            echo "::error::No Xcode application found on this runner."
            exit 1
          fi
          EXPECTED="$LATEST/Contents/Developer"
          CURRENT=$(xcode-select -p)
          if [ "$CURRENT" = "$EXPECTED" ]; then
            echo "Xcode is already selected: $LATEST"
          elif [[ "${{ runner.environment }}" = "self-hosted" ]]; then
            echo "::error::Self-hosted runner selects $CURRENT; configure xcode-select as an administrator to use $EXPECTED."
            exit 1
          else
            echo "Selecting $LATEST"
            sudo xcode-select -s "$EXPECTED"
          fi
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/QueenZone.Mobile/package-lock.json

      - name: Install
        run: npm ci

      - name: Verify self-hosted CocoaPods
        if: runner.environment == 'self-hosted'
        run: |
          if ! command -v pod >/dev/null; then
            echo "::error::CocoaPods is not available to the runner service. Install it with Homebrew and ensure /opt/homebrew/bin is on PATH."
            exit 1
          fi
          pod --version

      # Cache only CocoaPods downloads, never generated ios/Pods. Restoring
      # ios/Pods after `expo prebuild` (especially via restore-keys) overwrites
      # Manifest.lock and fails Check Pods Manifest.lock.
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-${{ runner.os }}-${{ hashFiles('src/QueenZone.Mobile/package-lock.json') }}
          restore-keys: |
            cocoapods-${{ runner.os }}-

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --clean

      # Unsigned CI builds must not call sentry-cli upload (no org/token here).
      # Without this, Bundle RN / Upload Debug Symbols fails with
      # "An organization ID or slug is required" once the Sentry Expo plugin
      # is registered (#855 / #857). Publish workflows set credentials and upload.
      - name: Build for iOS Simulator
        working-directory: src/QueenZone.Mobile/ios
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          # Expo CNG names the app scheme after the workspace itself
          # (QueenZone.xcworkspace -> scheme QueenZone). Do not pick from
          # `xcodebuild -list`'s scheme list: a workspace lists every Pods
          # library scheme too (e.g. "EXConstants"), sorted alphabetically
          # ahead of the app's own scheme, and building one of those directly
          # breaks its dependency ordering.
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Zip Simulator app bundle
        working-directory: src/QueenZone.Mobile/ios
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          APP=$(ls -d *.app | head -n 1)
          zip -r -y "$GITHUB_WORKSPACE/mobile-ios-simulator.zip" "$APP"

      - name: Upload iOS Simulator build
        uses: actions/upload-artifact@v7
        with:
          name: mobile-ios-${{ github.run_id }}
          path: mobile-ios-simulator.zip
          retention-days: 1
          if-no-files-found: error

      - name: Record selected runner
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          echo "### Mobile iOS runner" >> "$GITHUB_STEP_SUMMARY"
          echo "Selected: **${{ needs.mobile-ios-runner.outputs.runner_class }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "Runner: \`${{ runner.name }}\` (\`${{ runner.os }}\` / \`${{ runner.arch }}\`)" >> "$GITHUB_STEP_SUMMARY"

  # Required on main after #870. Non-mobile PRs must still report these exact
  # check names as success; otherwise GitHub leaves the required checks pending.
  # Same idea as test-docs-ok. Stubs run on ubuntu even for the iOS name so a
  # docs-only PR does not consume a macOS runner.
  mobile-js-ok:
    name: Mobile typecheck and unit tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.mobile != 'true'
    steps:
      - name: No mobile changes — required check satisfied
        run: echo "No mobile changes — marking Mobile typecheck and unit tests as satisfied without running the mobile suite."

  mobile-android-ok:
    name: Mobile Android build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.mobile_native != 'true'
    steps:
      - name: No mobile changes — required check satisfied
        run: echo "No mobile changes — marking Mobile Android build as satisfied without compiling Android."

  mobile-ios-ok:
    name: Mobile iOS build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.mobile_native != 'true'
    steps:
      - name: No mobile changes — required check satisfied
        run: echo "No mobile changes — marking Mobile iOS build as satisfied without compiling iOS."

  # Deterministic mobile consumer contracts against the Testing host (#869 / Option A).
  # Independent of mobile=true so server-only /api/v1 changes run this job without
  # Android/iOS native compilation. Does not use live data, Azure SQL, Blob, or OAuth.
  mobile-api-contracts:
    name: Mobile API consumer contracts
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.mobile_api_contracts == 'true'
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            .config/dotnet-tools.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/QueenZone.Mobile/package-lock.json

      - name: Restore and build web
        run: |
          dotnet restore QueenZone.sln
          dotnet build src/QueenZone.Web/QueenZone.Web.csproj --configuration Release --no-restore

      - name: Install mobile packages
        working-directory: src/QueenZone.Mobile
        run: npm ci

      - name: Run mobile API consumer contracts
        run: bash ./scripts/run-mobile-api-contracts.sh --no-build

  mobile-api-contracts-ok:
    name: Mobile API consumer contracts
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.mobile_api_contracts != 'true'
    steps:
      - name: No mobile API contract changes — required check satisfied
        run: echo "No mobile API contract changes — marking Mobile API consumer contracts as satisfied without starting the Testing host."

  # De-risks drift between design/tokens/ (canonical) and its copies —
  # src/QueenZone.Web/wwwroot/design-system/tokens/ and every
  # design_handoff_*/tokens/ folder (issue #1466). Independent of code=
  # since design/ is otherwise excluded from the .NET suite.
  design-tokens-check:
    name: Design token sync check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.design_tokens == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Check design token copies are in sync
        shell: pwsh
        run: ./scripts/Sync-DesignTokens.ps1 -Check

  design-tokens-check-ok:
    name: Design token sync check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.design_tokens != 'true'
    steps:
      - name: No design token changes — required check satisfied
        run: echo "No design token changes — marking Design token sync check as satisfied without comparing copies."

  # Builds and publishes the Linux app once per PR run ("build once, test many").
  # Deterministic tests run in the `test` matrix (mixed Web.Tests shards — see
  # docs/architecture/testing-policy.md). smoke-test reuses the publish
  # artifact. e2e-test still builds on Windows but skips the solution unit graph.
  # deploy.yml reuses this run's web-publish artifact after merge instead of
  # rebuilding — see that file for how it resolves which run to pull from.
  build:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            .config/dotnet-tools.json

      - name: Restore
        run: dotnet restore QueenZone.sln

      - name: Build
        run: |
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          if [ -z "$HEAD_SHA" ]; then
            HEAD_SHA="${{ github.sha }}"
          fi
          SHORT="${HEAD_SHA:0:7}"
          echo "Stamping QueenZone.Web InformationalVersion=$SHORT"
          dotnet build QueenZone.sln --configuration Release --no-restore \
            /p:OverrideGitCommitShort="$SHORT"

      # Sharded test jobs download these outputs and run `dotnet test --no-build`
      # so we do not pay a second full compile on each matrix leg.
      # WAF hosts need QueenZone.Web compressed static-web-asset intermediates
      # (src/QueenZone.Web/obj/.../compressed/). Other obj trees are omitted.
      # Keep PDBs: Coverlet maps executed lines from them, so a --no-build
      # shard without symbols reports a few percent global coverage.
      # Keep *.xml: NewsAgent tests copy fixture XML into bin/Release.
      - name: Upload build binaries
        uses: actions/upload-artifact@v7
        with:
          name: build-binaries-${{ github.run_id }}
          path: |
            src/**/bin/Release/
            tests/**/bin/Release/
            src/QueenZone.Web/obj/Release/
          retention-days: 1
          if-no-files-found: error

      # Single Linux publish reused by smoke-test in this run.
      - name: Publish web app
        run: dotnet publish src/QueenZone.Web/QueenZone.Web.csproj --configuration Release --no-build --output publish

      - name: Upload publish artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-publish-${{ github.run_id }}
          path: publish
          # Keep short: deploy.yml downloads this from the merged PR's CI run
          # (usually within hours). Longer retention was the bulk of Actions storage.
          retention-days: 1

  # Runs in parallel with build/test instead of as a step inside `build` (issue #495).
  # dotnet format re-analyzes the whole solution and took ~90s standalone — nearly as
  # long as the actual compile — and previously ran *before* the build/publish
  # artifacts were uploaded, so `test`/`sql-server-tests` waited on it for no reason
  # (they only need the compiled binaries, not the formatting result).
  format:
    name: Verify formatting
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            .config/dotnet-tools.json

      - name: Restore
        run: dotnet restore QueenZone.sln

      - name: Verify formatting
        run: dotnet format QueenZone.sln --verify-no-changes --no-restore

  # Informational only (issue #592): surfaces known vulnerable NuGet packages in the
  # PR summary without failing the build. Package-level suppressions with rationale
  # live in Directory.Build.props; promote this to a gating check if the team decides
  # vulnerable transitive deps should block merges.
  vulnerable-packages:
    name: Check for vulnerable packages
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            .config/dotnet-tools.json

      - name: Restore
        run: dotnet restore QueenZone.sln

      - name: List vulnerable packages
        run: |
          dotnet list QueenZone.sln package --vulnerable --include-transitive \
            | tee -a "$GITHUB_STEP_SUMMARY"

  # Mixed Web.Tests shards (unit + WAF in every shard). Do not change this to a
  # unit-vs-integration split — that regresses wall-clock (issue #442).
  test:
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            .config/dotnet-tools.json

      - name: Download build binaries
        uses: actions/download-artifact@v8
        with:
          name: build-binaries-${{ github.run_id }}
          path: .

      - name: Restore (NuGet cache for test host deps)
        run: dotnet restore QueenZone.sln

      - name: Show shard assignment
        shell: pwsh
        run: ./scripts/Get-WebTestShardFilter.ps1 -ShardIndex ${{ matrix.shard }} -ShardCount 4 -List

      - name: Test shard ${{ matrix.shard }} with coverage
        shell: pwsh
        run: |
          ./scripts/Invoke-WebTestsShard.ps1 `
            -ShardIndex ${{ matrix.shard }} `
            -ShardCount 4 `
            -CollectCoverage `
            -ResultsDirectory ./TestResults `
            -NoBuild `
            -NoRestore

      - name: Upload coverage results
        uses: actions/upload-artifact@v7
        with:
          name: coverage-raw-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: TestResults
          retention-days: 1
          if-no-files-found: error

  # Split out of shard 0 (issue #496): shard 0 previously also ran the Tools/Storage/
  # NewsAgent projects on top of its even Web.Tests share, making it ~60% slower in
  # wall-clock than shard 1 despite the Web.Tests greedy balancer already splitting
  # weight 244/244 evenly. Running these small, independent projects as their own
  # parallel job removes that skew instead of guessing at new Web.Tests weights.
  small-projects-tests:
    name: Small test projects (Tools/Storage/NewsAgent)
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            .config/dotnet-tools.json

      - name: Download build binaries
        uses: actions/download-artifact@v8
        with:
          name: build-binaries-${{ github.run_id }}
          path: .

      - name: Restore (NuGet cache for test host deps)
        run: dotnet restore QueenZone.sln

      - name: Run small test projects with coverage
        shell: pwsh
        run: |
          ./scripts/Invoke-WebTestsShard.ps1 `
            -SmallProjectsOnly `
            -CollectCoverage `
            -ResultsDirectory ./TestResults `
            -NoBuild `
            -NoRestore

      - name: Upload coverage results
        uses: actions/upload-artifact@v7
        with:
          name: coverage-raw-${{ github.run_id }}-shard-small
          path: TestResults
          retention-days: 1
          if-no-files-found: error

  # PRs that skip the web suite (docs / infra / design / .github except
  # ci.yml / mobile-only) skip the real `test` matrix above. When a matrix
  # job is skipped entirely, GitHub reports a single check named `test` —
  # not `test (0)` / `test (1)` / `test (2)` / `test (3)`. Those matrix names are required
  # status checks on `main`, so skipped PRs would stay blocked forever waiting for
  # checks that never start. Emit matching success checks instead. See
  # docs/architecture/testing-policy.md.
  test-docs-ok:
    name: test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code != 'true'
    strategy:
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: No web-app changes — required check satisfied
        run: echo "No web-app changes — marking test (${{ matrix.shard }}) as satisfied without running the .NET suite."

  # Runs the modern-schema query paths that only SQL Server can execute (EF Core's SQLite
  # provider used by the `test` job above cannot translate DateTimeOffset comparisons at all).
  # See tests/QueenZone.SqlServerTests and docs/architecture/testing-policy.md
  # ("Modern-schema SQL Server tests"). This is a throwaway container scoped to CI, not the
  # SQL Express mirror used by `ef-migrations` or the Azure SQL used by deploy.yml.
  sql-server-tests:
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "CiOnly!Sql_2026"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P CiOnly!Sql_2026 -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            .config/dotnet-tools.json

      - name: Restore
        run: dotnet restore QueenZone.sln

      - name: Run SQL Server-only tests with coverage
        shell: pwsh
        env:
          ConnectionStrings__SqlServerTest: "Server=localhost,1433;User Id=sa;Password=CiOnly!Sql_2026;TrustServerCertificate=True"
        run: |
          dotnet test tests/QueenZone.SqlServerTests/QueenZone.SqlServerTests.csproj `
            --configuration Release `
            --collect:"XPlat Code Coverage" `
            --settings coverlet.runsettings `
            --results-directory ./TestResults

      - name: Upload coverage results
        uses: actions/upload-artifact@v7
        with:
          name: coverage-raw-${{ github.run_id }}-shard-sqlserver
          path: TestResults
          retention-days: 1
          if-no-files-found: error

  coverage:
    runs-on: ubuntu-latest
    needs: [changes, test, sql-server-tests, small-projects-tests]
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download coverage results
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-raw-${{ github.run_id }}-shard-*
          path: TestResults
          merge-multiple: true

      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@v5
        with:
          reports: TestResults/**/coverage.cobertura.xml
          targetdir: coverage-report
          reporttypes: HtmlInline;Cobertura;MarkdownSummaryGithub

      - name: Add coverage summary
        run: cat coverage-report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Self-test coverage gate loader
        shell: pwsh
        run: ./scripts/Test-CoverageGate.ps1 -SelfTest

      - name: Enforce coverage gate
        shell: pwsh
        run: ./scripts/Test-CoverageGate.ps1 -Reports ./TestResults -GlobalLineThreshold 51 -ChangedLineThreshold 70

      - name: Build observed Web.Tests duration map
        shell: pwsh
        run: |
          ./scripts/Update-WebTestDurations.ps1 `
            -Reports ./TestResults `
            -Existing ./scripts/web-test-class-durations.json `
            -Output ./web-test-class-durations.json

      - name: Upload observed Web.Tests duration map
        uses: actions/upload-artifact@v7
        with:
          name: web-test-class-durations-${{ github.run_id }}
          path: web-test-class-durations.json
          retention-days: 7
          if-no-files-found: error

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ github.run_id }}
          path: coverage-report
          retention-days: 1

  # build-binaries (~100MB) and coverage-raw are only needed while this run's
  # test/coverage jobs are in flight. Leaving them until retention expires was
  # blowing a 2GB Actions storage quota on busy days (many concurrent PRs).
  # Delete them as soon as coverage finishes; keep web-publish (deploy) and
  # coverage-report (1-day retention) for post-merge / debugging.
  cleanup-ephemeral-artifacts:
    name: Cleanup ephemeral artifacts
    runs-on: ubuntu-latest
    needs: [changes, coverage]
    if: always() && needs.changes.outputs.code == 'true'
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete build-binaries and coverage-raw for this run
        uses: actions/github-script@v9
        with:
          script: |
            const names = new Set([
              `build-binaries-${context.runId}`,
            ]);
            // Prefix match so shard-2 (and later shards) are deleted, not
            // only the original shard-0/1 plus small/sqlserver leftovers.
            const coverageRawPrefix = `coverage-raw-${context.runId}-shard-`;
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100,
              });
            for (const artifact of artifacts) {
              if (!names.has(artifact.name) && !artifact.name.startsWith(coverageRawPrefix)) {
                continue;
              }
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
              core.info(`Deleted ${artifact.name} (${artifact.size_in_bytes} bytes)`);
            }

  ef-migrations:
    name: EF migrations (SQL Express mirror)
    # Same Windows box the disposable mirror lives on — Integrated Security,
    # no production connection string, no GitHub Environment (issue #1377
    # Option B). Fork PRs skip this (no self-hosted access). Production
    # Azure SQL `database update` stays on deploy.yml migrate after merge /
    # tag / dispatch. Express ≠ Azure (filegroups, collation, DTU-bound DDL);
    # those failures move to the post-merge migrate rather than disappearing.
    runs-on: [self-hosted, Windows]
    needs: changes
    if: |
      needs.changes.outputs.migrations == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore tools and solution
        run: |
          dotnet tool restore
          dotnet restore QueenZone.sln

      - name: Check EF model snapshot is current
        run: |
          dotnet ef migrations has-pending-model-changes `
            --project src/QueenZone.Data/QueenZone.Data.csproj `
            --startup-project src/QueenZone.Web/QueenZone.Web.csproj

      - name: Apply migrations to the SQL Express mirror
        env:
          ConnectionStrings__QueenZoneLegacy: "Server=localhost\\SQLEXPRESS;Database=queenzone_legacy_sync;Integrated Security=True;TrustServerCertificate=True"
        run: |
          ./scripts/Assert-SqlExpressMirrorConnection.ps1 -ConnectionString $env:ConnectionStrings__QueenZoneLegacy
          echo "Applying EF migrations against the SQL Express mirror (not production Azure SQL)."
          echo "Production database update remains deploy.yml migrate after merge/tag/dispatch."
          dotnet ef database update `
            --project src/QueenZone.Data/QueenZone.Data.csproj `
            --startup-project src/QueenZone.Web/QueenZone.Web.csproj

  smoke-test:
    # Reuses the Linux publish artifact from build — no second restore/build.
    # Starts as soon as build uploads web-publish so it overlaps shards +
    # coverage (issue #654). Merge is still blocked if test/coverage fail.
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 5

    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v8
        with:
          name: web-publish-${{ github.run_id }}
          path: smoke-app

      - name: Start app in background
        run: |
          # Content root must be the publish folder so appsettings*.json (including
          # Admin:AllowedEmails in appsettings.Testing.json) are loaded. Without this,
          # cwd is the job workspace root and ValidateOnStart fails with empty admin options.
          chmod +x ./smoke-app/QueenZone.Web
          APP_DIR="$(pwd)/smoke-app"
          ASPNETCORE_ENVIRONMENT=Testing \
          ASPNETCORE_URLS=http://127.0.0.1:5099 \
          ASPNETCORE_CONTENTROOT="$APP_DIR" \
          "$APP_DIR/QueenZone.Web" > smoke-app.log 2>&1 &
          echo $! > smoke-app.pid

      - name: Wait for app to be ready
        run: |
          echo "Waiting for web app..."
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5099/health > /dev/null; then
              echo "App is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "App failed to start in time"
          cat smoke-app.log || true
          exit 1

      - name: Smoke checks for key routes
        run: |
          curl -sf http://127.0.0.1:5099/health | grep -q '"status":"ok"' || { echo "Health endpoint failed"; exit 1; }
          curl -sf http://127.0.0.1:5099/ | grep -q "Latest news" || { echo "Homepage content missing"; exit 1; }
          curl -sf http://127.0.0.1:5099/news | grep -q "News archive" || { echo "News archive content missing"; exit 1; }

      - name: Upload app log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-app-log-${{ github.run_id }}
          path: smoke-app.log
          retention-days: 1

  e2e-test:
    # Runs on whichever self-hosted runner with the `e2e` label is online and
    # idle (currently a Windows box and a Mac — see repo Settings > Actions >
    # Runners), instead of a GitHub-hosted runner, so it does not consume
    # billed Actions minutes. GitHub queues to whichever matching runner
    # picks the job up first; there's no guaranteed preference between them,
    # so steps below branch on `runner.os` to cover both. Both runners need
    # the .NET 10 SDK on PATH already (see "Verify .NET SDK" below); the
    # macOS runner additionally needs PowerShell 7 (`pwsh`, e.g. via
    # `brew install --cask powershell`) because the job invokes
    # scripts/Run-E2E.ps1 (publish/start/test/stop + Playwright's generated
    # installer).
    #
    # Starts after `build` so a broken compile does not occupy the self-hosted
    # runner, but does not wait for coverage (issue #654). Merge is still
    # blocked if shards or coverage fail.
    #
    # This is a merge gate enforced by main's required status checks, not a
    # deploy gate — deploy.yml does not re-run e2e, so a deploy is never
    # blocked by both runners being offline. Untested code still can't reach
    # main because the PR itself can't merge without a green run here.
    runs-on: [self-hosted, e2e]
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 15

    steps:
      # If a previous run's stop logic failed to terminate the real
      # QueenZone.Web(.exe) child process (see scripts/Run-E2E.ps1), it
      # is left running and (on Windows) holding its own exe file locked,
      # which makes actions/checkout's workspace clean fail with an EPERM
      # unlink error before any of our own steps even run. Clear out any
      # leftover process from a prior run first so checkout can clean the
      # workspace.
      - name: Kill stray app processes from a previous run (Windows)
        if: runner.os == 'Windows'
        run: |
          Get-Process -Name "QueenZone.Web" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Kill stray app processes from a previous run (macOS)
        if: runner.os == 'macOS'
        run: pkill -f QueenZone.Web || true

      - name: Checkout
        uses: actions/checkout@v7

      # actions/setup-dotnet tries to (re)install into a system path the
      # runner service account cannot write to without elevation. Both
      # machines already have the .NET 10 SDK installed and on PATH, so use
      # that directly instead of running the action here.
      - name: Verify .NET SDK
        run: dotnet --version

      # Publish → start → poll /health → Deterministic Playwright → stop lives in
      # scripts/Run-E2E.ps1 (issue #544) so local on-demand runs and CI share one
      # implementation. Pin Mode=Deterministic so nightly RealData fixtures never
      # enter the merge gate (see #543 / epic #540).
      # Windows runners have Windows PowerShell 5.1 (`powershell`); macOS needs
      # PowerShell 7 (`pwsh`) for the script and Playwright's generated installer.
      - name: Run Playwright e2e tests (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/Run-E2E.ps1 -Mode Deterministic

      - name: Run Playwright e2e tests (macOS)
        if: runner.os == 'macOS'
        shell: pwsh
        run: ./scripts/Run-E2E.ps1 -Mode Deterministic

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-playwright-${{ github.run_id }}
          path: |
            test-results/e2e/
            e2e-app.log
            e2e-app.err.log
          if-no-files-found: ignore
          retention-days: 1
