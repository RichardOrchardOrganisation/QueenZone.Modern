name: Deploy dev

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions: {}

env:
  SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}

concurrency:
  # Keep automatic dev releases independent from deliberate production
  # promotions and manual production deployments.
  group: deploy-dev-${{ github.ref }}
  # Never cancel an in-flight run here — cancelling mid-migrate/deploy can
  # leave the DB or App Service half-updated.
  cancel-in-progress: false

# Runs after a PR merges to main. ci.yml already ran the full test/coverage/
# e2e suite against this exact tree as a required status check before the
# merge was allowed (see branch protection on main), so none of that re-runs
# here.
#
# Same reuse + fallback + skip model as deploy.yml (do not split):
# Reuse-first: when the matching PR ci.yml run still has a non-expired
# web-publish-{run_id} artifact AND that PR head's git tree equals the
# main tip's tree, download and ship that zip. Same tree means the
# squash/merge is byte-identical to the PR build. A stale PR head
# (different tree) is never reused.
# Fallback: if resolve cannot find a tree-matching web-publish *and* a
# website Deploy is still required, publish from the checked-out main
# SHA, stamp that SHA, and deploy.
# Skip (do not walk back): workflow_dispatch classifies tip vs previous
# main commit. Mobile-only / docs-only / workflow-only → code=false →
# skip resolve/migrate/deploy/smoke. Push to main uses the push span.
# Mixed web+mobile still deploys: resolve-ci-run keys off the web-publish
# artifact (not overall ci.yml success), because long Mobile iOS/Android
# jobs can leave the workflow in_progress after required web checks — and
# merge — already passed.
# post-deploy-smoke is the safety net after the real deploy.
jobs:
  # Mirrors ci.yml's non-web bypass (scripts/classify-pipeline-changes.sh).
  # Skip when the classified range is mobile-only / docs / workflow-only —
  # nothing to redeploy, and walking back to an older web tip is forbidden.
  # workflow_dispatch classifies tip vs previous main commit (do not force
  # code=true). Push to main classifies github.event.before…sha.
  changes:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: dev-deploy
    permissions:
      contents: read
      id-token: write
    outputs:
      code: ${{ steps.check.outputs.code }}
      migrations: ${{ steps.check.outputs.migrations }}
      mobile: ${{ steps.check.outputs.mobile }}
      sample_data: ${{ steps.snapshot-state.outputs.sample_data }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: Read dev snapshot readiness
        id: snapshot-state
        shell: bash
        run: |
          snapshot_ready=$(az webapp config appsettings list \
            --name queenzone-devbox \
            --resource-group Queenzone-Dev-RG \
            --query "[?name=='DevSnapshot__Ready'].value | [0]" \
            -o tsv | tr -d '\r')

          if [ "$snapshot_ready" = "true" ]; then
            echo "sample_data=false" >> "$GITHUB_OUTPUT"
            echo "Verified curated snapshot is enabled."
          else
            echo "sample_data=true" >> "$GITHUB_OUTPUT"
            echo "Curated snapshot is not verified; keeping deterministic sample data."
          fi

      - name: Self-test change classifier
        run: bash ./scripts/classify-pipeline-changes.sh --self-test
      - name: Self-test deploy change range
        run: bash ./scripts/Resolve-DeployChangeRange.sh --self-test
      - name: Self-test post-deploy smoke matcher
        run: bash ./scripts/Invoke-PostDeploySmoke.sh --self-test
      - name: Self-test CI publish-run resolver
        run: bash ./scripts/Resolve-CiPublishRun.sh --self-test
      - name: Check for code changes
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          range="$(bash ./scripts/Resolve-DeployChangeRange.sh)"
          echo "$range"
          fail_closed="$(printf '%s\n' "$range" | sed -n 's/^fail_closed=//p')"
          if [ "$fail_closed" = "true" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "migrations=true" >> "$GITHUB_OUTPUT"
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base_sha="$(printf '%s\n' "$range" | sed -n 's/^base_sha=//p')"
          head_sha="$(printf '%s\n' "$range" | sed -n 's/^head_sha=//p')"
          git diff --name-only "${base_sha}...${head_sha}" \
            | bash ./scripts/classify-pipeline-changes.sh \
            >> "$GITHUB_OUTPUT"

  # Finds the ci.yml run that built+tested this exact tree, so `deploy`
  # can download its publish artifact instead of rebuilding. Soft-miss
  # (found=false) is not a hard fail: deploy then publishes from the
  # checked-out SHA. github.sha on main is the merge result, not the PR
  # head that ci.yml ran against:
  #   - merge commits (2 parents): second parent is the PR head
  #   - squash/rebase merges (1 parent): look up the associated PR head via API
  #   - direct pushes with no PR: fall back to github.sha itself
  # Reuse that PR-head zip only when its git tree equals the release
  # commit's tree. Otherwise found=false (fresh publish).
  resolve-ci-run:
    runs-on: ubuntu-latest
    needs: changes
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      found: ${{ steps.find.outputs.found }}
      run_id: ${{ steps.find.outputs.run_id }}
      head_sha: ${{ steps.sha.outputs.head_sha }}
      run_head_sha: ${{ steps.find.outputs.run_head_sha }}
      expect_build_version: ${{ steps.stamp.outputs.expect_build_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine PR head SHA
        id: sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_SHA=$(git rev-parse HEAD)
          PARENTS=($(git rev-list --parents -n 1 HEAD))
          if [ "${#PARENTS[@]}" -ge 3 ]; then
            HEAD_SHA="${PARENTS[2]}"
            echo "Merge commit — using second parent as PR head SHA."
          else
            # Squash/rebase merge: the commit on main is not the PR head that
            # ci.yml tested. Resolve via the commit→PR association.
            HEAD_SHA=$(gh api "repos/${{ github.repository }}/commits/${PARENTS[0]}/pulls" \
              --jq '.[0].head.sha // empty')
            if [ -n "$HEAD_SHA" ]; then
              echo "Single-parent commit — resolved associated PR head SHA."
            else
              HEAD_SHA="${PARENTS[0]}"
              echo "No associated PR — falling back to commit SHA itself."
            fi
          fi
          # Squash-merge checkouts of main do not contain the PR-head
          # object. Fetch it so ^{tree} rev-parse can compare them.
          for sha in "$TARGET_SHA" "$HEAD_SHA"; do
            if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              echo "Fetching ${sha} for tree compare."
              git fetch --no-tags origin "$sha" \
                || echo "Fetch of ${sha} failed; tree compare will refuse reuse."
            fi
          done
          echo "Release SHA: $TARGET_SHA"
          echo "Resolved PR head SHA: $HEAD_SHA"
          echo "release_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      # Prefer web-publish artifact presence over overall workflow conclusion.
      # Mixed web+mobile PRs leave ci.yml in_progress on native builds after
      # required web checks (and merge) already passed — see
      # scripts/Resolve-CiPublishRun.sh and deploys after #860 / #866.
      - name: Self-test CI publish-run resolver
        run: bash ./scripts/Resolve-CiPublishRun.sh --self-test
      - name: Find matching CI run
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.sha.outputs.head_sha }}
          RELEASE_SHA: ${{ steps.sha.outputs.release_sha }}
        run: |
          echo "Looking up ci.yml web-publish for PR head ${HEAD_SHA} vs release ${RELEASE_SHA}."
          bash ./scripts/Resolve-CiPublishRun.sh >> "$GITHUB_OUTPUT"

      - name: Choose build stamp
        id: stamp
        run: |
          FOUND="${{ steps.find.outputs.found }}"
          HEAD_SHA="${{ steps.sha.outputs.head_sha }}"
          RUN_ID="${{ steps.find.outputs.run_id }}"
          RUN_HEAD_SHA="${{ steps.find.outputs.run_head_sha }}"
          HEAD_TREE="${{ steps.find.outputs.head_tree }}"
          RELEASE_TREE="${{ steps.find.outputs.release_tree }}"
          CHECKOUT_SHA=$(git rev-parse HEAD)
          echo "Tree compare: PR-head ${HEAD_TREE:-unknown} vs release ${RELEASE_TREE:-unknown} (found=${FOUND})."
          if [ "$FOUND" = "true" ]; then
            echo "Reuse CI web-publish run ${RUN_ID} at PR-head SHA ${RUN_HEAD_SHA:-$HEAD_SHA} (trees match)."
            echo "expect_build_version=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "No tree-matching web-publish; fallback publish will stamp checkout ${CHECKOUT_SHA}."
            echo "expect_build_version=$CHECKOUT_SHA" >> "$GITHUB_OUTPUT"
          fi

  migrate:
    name: Apply database migrations
    runs-on: ubuntu-latest
    needs: [changes]
    # Does not wait on resolve-ci-run — that output is only for the zip deploy.
    # Skip the restore/`database update` when the classified range did not
    # touch EF paths (issue #659). Dispatch uses the same classifier
    # (tip vs parent) — do not force migrations=true.
    # Runs regardless of DevSnapshot__Ready: dev must prove every migration
    # against queenzone-dev-db before production (#1600). Sample-data vs
    # curated-snapshot only changes what data the app serves, not whether
    # the schema is kept current.
    if: |
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.code == 'true' &&
      needs.changes.outputs.migrations == 'true'
    environment: dev-migrate
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            .config/dotnet-tools.json

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore QueenZone.sln

      - name: Fetch Bitwarden deploy secrets
        id: bitwarden-secrets
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.BITWARDEN_SECRETS_MANAGER_ACCESS_TOKEN }}
          secrets: ${{ vars.BITWARDEN_APP_SERVICE_DEPLOY_SECRETS }}

      - name: Apply database migrations
        env:
          ConnectionStrings__QueenZoneLegacy: ${{ steps.bitwarden-secrets.outputs.QUEENZONE_LEGACY_MIGRATION_CONNECTION_STRING }}
        run: |
          if [ -z "$ConnectionStrings__QueenZoneLegacy" ]; then
            echo "::error::QUEENZONE_LEGACY_MIGRATION_CONNECTION_STRING is not configured. Check the Bitwarden secret and BITWARDEN_APP_SERVICE_DEPLOY_SECRETS mapping before deploying."
            exit 1
          fi

          dotnet ef database update \
            --project src/QueenZone.Data/QueenZone.Data.csproj \
            --startup-project src/QueenZone.Web/QueenZone.Web.csproj

  # WEBSITE_RUN_FROM_PACKAGE=1 (mount the zip read-only rather than extracting
  # it) was removed after it repeatedly served stale builds post-deploy: a
  # worker could pass the post-deploy build-stamp smoke check and then revert
  # to the previous build minutes later with no further restart logged,
  # consistent with the old worker not draining cleanly during the mount
  # handoff. Plain extract-mode deploys do not have this failure mode.
  # WEBSITE_WARMUP_PATH is still ARM-owned here (Kudu POST /api/settings
  # cannot persist ARM Application Settings — it returns 204 but does not
  # take effect, #660/#664), through a dedicated OIDC identity scoped to
  # Website Contributor on queenzone-devbox only (#666), never through
  # scripts/Invoke-AppServiceKudu.py.
  #
  # WEBSITE_WARMUP_PATH points at /health, not /warmup. Azure's own container
  # startup probe must succeed within WEBSITES_CONTAINER_START_TIME_LIMIT
  # (default 230s) or the platform kills the container and retries. /warmup
  # runs dependency checks and primes public caches, so it is a deploy-time
  # readiness gate rather than the platform's container-liveness gate.
  # Pointing the platform probe at /warmup crash-looped
  # the App Service for over an hour on the first #666 rollout. /health stays
  # cheap (no dependency I/O) so it can't blow the platform's tight budget.
  # WEBSITE_WARMUP_STATUSES stays unset: App Service pings can carry an internal
  # link-local Host header, and the old ASP.NET Core host filter rejected that
  # before /health with 400. Requiring exactly 200 turned the rejection into a
  # 230-second crash loop (#684). The app now bypasses host validation for probe
  # paths, but accepting any HTTP response remains the safer platform liveness
  # contract; the post-deploy /warmup + route smoke below is the strict gate.
  # deploy.yml's own "Warm up custom domain" step still hits /warmup
  # directly afterward, with its own ~8 minute retry budget — that is the
  # right amount of patience for "are caches warm," not a platform gate.
  configure-app-settings:
    name: Configure ARM Application Settings
    runs-on: ubuntu-latest
    needs: [changes, resolve-ci-run]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.code == 'true' &&
      needs.resolve-ci-run.result == 'success'
    environment: dev-deploy
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Fetch Bitwarden runtime secrets
        id: bitwarden-secrets
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.BITWARDEN_SECRETS_MANAGER_ACCESS_TOKEN }}
          secrets: ${{ vars.BITWARDEN_APP_SERVICE_DEPLOY_SECRETS }}

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      # az webapp config appsettings set restarts the SCM/Kudu container on
      # every call, whether or not the values actually changed — and this
      # job runs on every code deploy, not just the first flip. Writing
      # unconditionally would pay a 90s settle wait (see below) on every
      # deploy forever. Only write, and only wait, when the live settings
      # actually differ from the desired ones.
      - name: Check and set required application settings via ARM
        id: apply-settings
        env:
          ADMIN_ALLOWED_EMAIL: ${{ steps.bitwarden-secrets.outputs.ADMIN_ALLOWED_EMAIL }}
          APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ steps.bitwarden-secrets.outputs.APPLICATIONINSIGHTS_CONNECTION_STRING }}
          AUTH_MICROSOFT_CLIENT_ID: ${{ steps.bitwarden-secrets.outputs.AUTH_MICROSOFT_CLIENT_ID }}
          AUTH_MICROSOFT_CLIENT_SECRET: ${{ steps.bitwarden-secrets.outputs.AUTH_MICROSOFT_CLIENT_SECRET }}
          AZURE_AD_CLIENT_ID: ${{ steps.bitwarden-secrets.outputs.AZURE_AD_CLIENT_ID }}
          AZURE_AD_CLIENT_SECRET: ${{ steps.bitwarden-secrets.outputs.AZURE_AD_CLIENT_SECRET }}
          BLOB_STORAGE_CONNECTION_STRING: ${{ steps.bitwarden-secrets.outputs.BLOB_STORAGE_CONNECTION_STRING }}
          MOBILE_AUTH_SIGNING_KEY: ${{ steps.bitwarden-secrets.outputs.MOBILE_AUTH_SIGNING_KEY }}
          GMAIL_APP_USERNAME: ${{ steps.bitwarden-secrets.outputs.GMAIL_APP_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ steps.bitwarden-secrets.outputs.GMAIL_APP_PASSWORD }}
          USE_SAMPLE_DATA: ${{ needs.changes.outputs.sample_data }}
        run: |
          required=(
            ADMIN_ALLOWED_EMAIL
            APPLICATIONINSIGHTS_CONNECTION_STRING
            AUTH_MICROSOFT_CLIENT_ID
            AUTH_MICROSOFT_CLIENT_SECRET
            AZURE_AD_CLIENT_ID
            AZURE_AD_CLIENT_SECRET
            BLOB_STORAGE_CONNECTION_STRING
            GMAIL_APP_USERNAME
            GMAIL_APP_PASSWORD
          )
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured for dev."
              exit 1
            fi
          done

          if [ "${#MOBILE_AUTH_SIGNING_KEY}" -lt 32 ]; then
            echo "::error::MOBILE_AUTH_SIGNING_KEY must map to a Bitwarden secret of at least 32 characters."
            exit 1
          fi

          desired=$(printf '%s\n' \
            "Admin__AllowedEmails__0=$ADMIN_ALLOWED_EMAIL" \
            "APPLICATIONINSIGHTS_CONNECTION_STRING=$APPLICATIONINSIGHTS_CONNECTION_STRING" \
            "Authentication__Microsoft__ClientId=$AUTH_MICROSOFT_CLIENT_ID" \
            "Authentication__Microsoft__ClientSecret=$AUTH_MICROSOFT_CLIENT_SECRET" \
            "AzureAd__CallbackPath=/signin-oidc" \
            "AzureAd__ClientId=$AZURE_AD_CLIENT_ID" \
            "AzureAd__ClientSecret=$AZURE_AD_CLIENT_SECRET" \
            "AzureAd__Instance=https://login.microsoftonline.com/" \
            "AzureAd__TenantId=c9f094fd-23bf-4a35-a406-bcaacd7e1a8e" \
            "BlobUpload__PublicBaseUrl=https://queenzonedev.blob.core.windows.net" \
            "ConnectionStrings__BlobStorage=$BLOB_STORAGE_CONNECTION_STRING" \
            "MobileAuth__SigningKey=$MOBILE_AUTH_SIGNING_KEY" \
            "SmtpEmail__Username=$GMAIL_APP_USERNAME" \
            "SmtpEmail__AppPassword=$GMAIL_APP_PASSWORD" \
            "SmtpEmail__FromAddress=support@queenzone.org" \
            "QueenZoneHostFiltering__AllowedHosts=dev.queenzone.org;queenzone-devbox.azurewebsites.net" \
            "Site__PublicBaseUrl=https://dev.queenzone.org" \
            "WEBSITE_WARMUP_PATH=/health" | sort)

          current=$(az webapp config appsettings list \
            --name queenzone-devbox \
            --resource-group Queenzone-Dev-RG \
            --query "[?name=='Admin__AllowedEmails__0' || name=='APPLICATIONINSIGHTS_CONNECTION_STRING' || name=='Authentication__Microsoft__ClientId' || name=='Authentication__Microsoft__ClientSecret' || name=='AzureAd__CallbackPath' || name=='AzureAd__ClientId' || name=='AzureAd__ClientSecret' || name=='AzureAd__Instance' || name=='AzureAd__TenantId' || name=='BlobUpload__PublicBaseUrl' || name=='ConnectionStrings__BlobStorage' || name=='MobileAuth__SigningKey' || name=='SmtpEmail__Username' || name=='SmtpEmail__AppPassword' || name=='SmtpEmail__FromAddress' || name=='QueenZoneHostFiltering__AllowedHosts' || name=='Site__PublicBaseUrl' || name=='WEBSITE_WARMUP_PATH'].[join('=', [name, value])]" \
            -o tsv | tr -d '\r' | sort)

          database_connection=$(az webapp config appsettings list \
            --name queenzone-devbox \
            --resource-group Queenzone-Dev-RG \
            --query "[?name=='ConnectionStrings__QueenZoneLegacy'].value | [0]" \
            -o tsv | tr -d '\r')

          strict_warmup_status=$(az webapp config appsettings list \
            --name queenzone-devbox \
            --resource-group Queenzone-Dev-RG \
            --query "[?name=='WEBSITE_WARMUP_STATUSES'].value | [0]" \
            -o tsv | tr -d '\r')

          # Kept absent by design (see comment above): a stale WEBSITE_RUN_FROM_PACKAGE=1
          # from before this removal must not linger and re-enable the read-only mount.
          run_from_package=$(az webapp config appsettings list \
            --name queenzone-devbox \
            --resource-group Queenzone-Dev-RG \
            --query "[?name=='WEBSITE_RUN_FROM_PACKAGE'].value | [0]" \
            -o tsv | tr -d '\r')

          changed=false
          if [ "$USE_SAMPLE_DATA" = "true" ] && [ -n "$database_connection" ]; then
            az webapp config appsettings delete \
              --name queenzone-devbox \
              --resource-group Queenzone-Dev-RG \
              --setting-names ConnectionStrings__QueenZoneLegacy \
              --output none
            changed=true
          fi

          if [ -n "$strict_warmup_status" ]; then
            az webapp config appsettings delete \
              --name queenzone-devbox \
              --resource-group Queenzone-Dev-RG \
              --setting-names WEBSITE_WARMUP_STATUSES \
              --output none
            changed=true
          fi

          if [ -n "$run_from_package" ]; then
            az webapp config appsettings delete \
              --name queenzone-devbox \
              --resource-group Queenzone-Dev-RG \
              --setting-names WEBSITE_RUN_FROM_PACKAGE \
              --output none
            changed=true
          fi

          if [ "$current" != "$desired" ]; then
            az webapp config appsettings set \
              --name queenzone-devbox \
              --resource-group Queenzone-Dev-RG \
              --settings \
                "Admin__AllowedEmails__0=$ADMIN_ALLOWED_EMAIL" \
                "APPLICATIONINSIGHTS_CONNECTION_STRING=$APPLICATIONINSIGHTS_CONNECTION_STRING" \
                "Authentication__Microsoft__ClientId=$AUTH_MICROSOFT_CLIENT_ID" \
                "Authentication__Microsoft__ClientSecret=$AUTH_MICROSOFT_CLIENT_SECRET" \
                "AzureAd__CallbackPath=/signin-oidc" \
                "AzureAd__ClientId=$AZURE_AD_CLIENT_ID" \
                "AzureAd__ClientSecret=$AZURE_AD_CLIENT_SECRET" \
                "AzureAd__Instance=https://login.microsoftonline.com/" \
                "AzureAd__TenantId=c9f094fd-23bf-4a35-a406-bcaacd7e1a8e" \
                "BlobUpload__PublicBaseUrl=https://queenzonedev.blob.core.windows.net" \
                "ConnectionStrings__BlobStorage=$BLOB_STORAGE_CONNECTION_STRING" \
                "MobileAuth__SigningKey=$MOBILE_AUTH_SIGNING_KEY" \
                "SmtpEmail__Username=$GMAIL_APP_USERNAME" \
                "SmtpEmail__AppPassword=$GMAIL_APP_PASSWORD" \
                "SmtpEmail__FromAddress=support@queenzone.org" \
                "QueenZoneHostFiltering__AllowedHosts=dev.queenzone.org;queenzone-devbox.azurewebsites.net" \
                "Site__PublicBaseUrl=https://dev.queenzone.org" \
                "WEBSITE_WARMUP_PATH=/health" \
              --output none
            changed=true
          fi

          if [ "$changed" = "false" ]; then
            echo "Settings already match; skipping write and restart wait."
          else
            echo "Settings updated; waiting for the resulting SCM restart before deploy."
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      # Only needed right after an actual settings write: Kudu killed the
      # in-flight OneDeploy on the #666 rollout run when the zip push started
      # ~25s after a settings write ("Deployment has been stopped due to SCM
      # container restart... Do not perform a management operation and a
      # deployment operation in quick succession"). Azure's own fix is the
      # delay it recommends.
      - name: Wait for SCM container to settle after the settings write
        if: steps.apply-settings.outputs.changed == 'true'
        run: sleep 90

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [changes, resolve-ci-run, migrate, configure-app-settings]
    # migrate is skipped on non-EF pushes; treat skipped as success so the
    # zip deploy still runs (issue #659).
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.code == 'true' &&
      needs.resolve-ci-run.result == 'success' &&
      needs.configure-app-settings.result == 'success' &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    environment:
      name: dev-deploy
      url: https://dev.queenzone.org
    # A stuck azure/webapps-deploy poll (e.g. hitting the SCM-restart race
    # this job now waits out) had no bound and hung for ~20 minutes before a
    # manual cancel on the #666 rollout run. Fail loudly instead.
    # Fallback publish adds restore+compile, so keep headroom above the reuse path.
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reuse-first: PR-head zip whose git tree matches the release commit.
      - name: Download publish artifact from CI run
        if: needs.resolve-ci-run.outputs.found == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-publish-${{ needs.resolve-ci-run.outputs.run_id }}
          run-id: ${{ needs.resolve-ci-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: publish

      # Fallback: no web-publish (retention prune, no PR run). Publish the
      # checked-out SHA and stamp that SHA — do not walk back to an older tip.
      - name: Setup .NET
        if: needs.resolve-ci-run.outputs.found != 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            .config/dotnet-tools.json

      - name: Publish website from checkout
        if: needs.resolve-ci-run.outputs.found != 'true'
        run: |
          CHECKOUT_SHA=$(git rev-parse HEAD)
          SHORT="${CHECKOUT_SHA:0:7}"
          echo "No CI web-publish — publishing QueenZone.Web from ${CHECKOUT_SHA} (stamp ${SHORT})."
          dotnet restore src/QueenZone.Web/QueenZone.Web.csproj
          dotnet publish src/QueenZone.Web/QueenZone.Web.csproj \
            --configuration Release \
            --output publish \
            /p:OverrideGitCommitShort="$SHORT"

      - name: Fetch Bitwarden deploy secrets
        id: bitwarden-secrets
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.BITWARDEN_SECRETS_MANAGER_ACCESS_TOKEN }}
          secrets: ${{ vars.BITWARDEN_APP_SERVICE_DEPLOY_SECRETS }}

      - name: Deploy
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: queenzone-devbox
          publish-profile: ${{ steps.bitwarden-secrets.outputs.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish

      # An explicit Kudu restart after the zip push is required for a worker
      # that can finish /warmup — skipping it after #688 left /warmup on HTTP
      # 500 empty and / flaking until the deploy job was cancelled. Keep the
      # stamp check as the strict readiness gate regardless of extract mode.
      - name: Recycle App Service
        env:
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ steps.bitwarden-secrets.outputs.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: python3 ./scripts/Invoke-AppServiceKudu.py --restart

      - name: Warm up custom domain
        run: |
          bash ./scripts/Invoke-PostDeploySmoke.sh \
            --base-url https://dev.queenzone.org \
            --warmup-only \
            --expect-build-version "${{ needs.resolve-ci-run.outputs.expect_build_version }}"

  post-deploy-smoke:
    name: Post-deploy smoke
    runs-on: ubuntu-latest
    needs: [changes, resolve-ci-run, deploy]
    # always() is required: migrate is skipped on non-EF pushes, and GitHub
    # then skips every descendant that does not opt out of that cascade —
    # even when `deploy` itself ran (run 31702420754 after #660).
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.code == 'true' &&
      needs.resolve-ci-run.result == 'success' &&
      needs.deploy.result == 'success'
    # Allow retry loop (~8 min) plus request time; avoid false fails during App Service recycle.
    timeout-minutes: 12
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Smoke the public custom domain (Site:PublicBaseUrl), not only the App Service hostname.
      # /health alone is liveness only — content pages can still 500 during recycle/warmup.
      # The deploy job already polled /warmup and the new build stamp; this job
      # still starts with warmup then the content-route suite. A failure fails
      # the job so watchers get mail.
      - name: Post-deploy smoke (custom domain)
        run: |
          bash ./scripts/Invoke-PostDeploySmoke.sh \
            --base-url https://dev.queenzone.org \
            --sample-data \
            --expect-build-version "${{ needs.resolve-ci-run.outputs.expect_build_version }}"
