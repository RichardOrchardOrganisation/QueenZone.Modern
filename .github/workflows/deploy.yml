name: Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      gate_override_reason:
        description: "Skip tip gates (v* tag ref only). At least 20 characters. Requires prod-gate-override approval and is logged on #2222."
        required: false
        type: string
      gate_only:
        description: "Dry-run the tip-gate check and stop (no migrate or deploy)."
        required: false
        type: boolean
        default: false

permissions: {}

env:
  SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}

concurrency:
  group: production-release
  # Never cancel an in-flight run here — cancelling mid-migrate/deploy can
  # leave the DB or App Service half-updated.
  cancel-in-progress: false

# Runs when a verified commit is promoted with a v* tag, or through a
# manual dispatch of that same v* tag. Tag pushes cannot override the
# three tip gates; re-dispatch the tag with gate_override_reason instead.
# ci.yml already ran the full test/coverage/e2e suite against this exact
# tree as a required status check before the merge was allowed (see
# branch protection on main), so none of that re-runs here.
#
# Production builds the exact checked-out release after proof gates, before
# any production mutation. Each privileged job verifies the immutable package
# and rechecks normal-path proofs before fetching credentials.
jobs:
  # Mirrors ci.yml's non-web bypass (scripts/classify-pipeline-changes.sh).
  # Skip when the classified range is mobile-only / docs / workflow-only —
  # nothing to redeploy, and walking back to an older web tip is forbidden.
  # workflow_dispatch classifies tip vs previous main commit (do not force
  # code=true). v* tags classify previous v* tag … this tag.
  changes:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    permissions:
      contents: read
    outputs:
      code: ${{ steps.check.outputs.code }}
      migrations: ${{ steps.check.outputs.migrations }}
      mobile: ${{ steps.check.outputs.mobile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Self-test change classifier
        run: bash ./scripts/classify-pipeline-changes.sh --self-test
      - name: Self-test deploy change range
        run: bash ./scripts/Resolve-DeployChangeRange.sh --self-test
      - name: Self-test post-deploy smoke matcher
        run: bash ./scripts/Invoke-PostDeploySmoke.sh --self-test
      - name: Self-test CI publish-run resolver
        run: bash ./scripts/Resolve-CiPublishRun.sh --self-test
      - name: Check for code changes
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          range="$(bash ./scripts/Resolve-DeployChangeRange.sh)"
          echo "$range"
          fail_closed="$(printf '%s\n' "$range" | sed -n 's/^fail_closed=//p')"
          if [ "$fail_closed" = "true" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "migrations=true" >> "$GITHUB_OUTPUT"
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base_sha="$(printf '%s\n' "$range" | sed -n 's/^base_sha=//p')"
          head_sha="$(printf '%s\n' "$range" | sed -n 's/^head_sha=//p')"
          git diff --name-only "${base_sha}...${head_sha}" \
            | bash ./scripts/classify-pipeline-changes.sh \
            >> "$GITHUB_OUTPUT"

  # Exact-SHA tip gates (#2291). Not a PR check. Fail closed, no polling.
  # Required when `changes` says migrate or deploy will run. Docs/mobile/
  # workflow-only ranges skip the three workflow lookups. Missing `changes`
  # outputs fail closed.
  # Do not use "Re-run failed jobs": that reuses a possibly stale
  # check-gates result. Re-run the entire workflow so this job runs again.
  check-gates:
    name: check-gates
    runs-on: ubuntu-latest
    needs: changes
    if: |
      (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') &&
      (
        github.event_name != 'workflow_dispatch' ||
        inputs.gate_only == true ||
        inputs.gate_override_reason == ''
      )
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify production tip gates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CHANGES_CODE: ${{ needs.changes.outputs.code }}
          CHANGES_MIGRATIONS: ${{ needs.changes.outputs.migrations }}
          PROD_GATE_MAX_AGE_HOURS: ${{ vars.PROD_GATE_MAX_AGE_HOURS }}
          GATE_ONLY: ${{ inputs.gate_only }}
        run: |
          # Peel annotated tags so the exact-SHA lookup uses the commit, not the tag object.
          export GITHUB_SHA
          GITHUB_SHA="$(git rev-parse 'HEAD^{commit}')"
          node scripts/release/check-gates.mjs

  gate-override-guard:
    name: gate-override-guard
    runs-on: ubuntu-latest
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' &&
      inputs.gate_only != true &&
      inputs.gate_override_reason != ''
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Validate override reason and ref
        env:
          GATE_OVERRIDE_REASON: ${{ inputs.gate_override_reason }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/release/check-gates.mjs --validate-override

  # Approval is specifically for skipping the tip gates. Same reviewer as
  # prod-release-gated. The reason is passed via env and posted to #2222
  # before migrate; if the comment fails, the deploy fails.
  gate-override:
    name: gate-override
    runs-on: ubuntu-latest
    needs: [changes, gate-override-guard]
    if: |
      github.event_name == 'workflow_dispatch' &&
      inputs.gate_only != true &&
      inputs.gate_override_reason != ''
    environment: prod-gate-override
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Log override on #2222
        env:
          GATE_OVERRIDE_REASON: ${{ inputs.gate_override_reason }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/release/check-gates.mjs --comment-override

  # No production identity or short-lived PR artifact is used during preparation.
  prepare-release:
    name: Prepare exact release package
    runs-on: ubuntu-latest
    needs: [changes, check-gates, gate-override]
    if: |
      always() &&
      (github.event_name != 'workflow_dispatch' || inputs.gate_only != true) &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.changes.outputs.code == 'true' &&
      (needs.check-gates.result == 'success' || (needs.check-gates.result == 'skipped' && needs.gate-override.result == 'success'))
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      package_sha256: ${{ steps.package.outputs.package_sha256 }}
      expect_build_version: ${{ steps.package.outputs.release_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Publish exact checkout
        run: |
          CHECKOUT_SHA=$(git rev-parse 'HEAD^{commit}')
          test "$CHECKOUT_SHA" = "$(git rev-parse '${{ github.sha }}^{commit}')"
          dotnet restore src/QueenZone.Web/QueenZone.Web.csproj
          dotnet publish src/QueenZone.Web/QueenZone.Web.csproj --configuration Release --output publish /p:OverrideGitCommitShort="${CHECKOUT_SHA:0:7}"
      - name: Seal release package
        id: package
        run: |
          mkdir release-input
          tar -czf release-input/release-package.tar.gz -C publish .
          RELEASE_SHA=$(git rev-parse 'HEAD^{commit}') node scripts/release/release-package.mjs create
      - name: Retain release-owned package
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-input/
          if-no-files-found: error
          retention-days: 7

  migrate:
    name: Apply database migrations
    runs-on: ubuntu-latest
    needs: [changes, prepare-release, check-gates, gate-override]
    # Acquire a verified package before any schema mutation.
    # Skip the restore/`database update` when the classified range did not
    # touch EF paths (issue #659). Dispatch and tags use the same classifier
    # (tip vs parent, or previous-tag…this-tag) — do not force migrations=true.
    # always() is required so a skipped gate-override does not cascade-skip
    # migrate; the gate-result clause still fails closed.
    if: |
      always() &&
      (github.event_name != 'workflow_dispatch' || inputs.gate_only != true) &&
      (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') &&
      needs.changes.outputs.code == 'true' &&
      needs.changes.outputs.migrations == 'true' &&
      needs.prepare-release.result == 'success' &&
      (needs.check-gates.result == 'success' || (needs.check-gates.result == 'skipped' && needs.gate-override.result == 'success'))
    # Production migrate + zip deploy share prod-release-gated (#2291/#2294).
    # Custom policy: tags v* only. Old tags keep prod-release and fail at
    # Azure login after Gilfoyle deletes that name. Behind check-gates /
    # gate-override. Do not use ungated prod-release or legacy "dev".
    environment: prod-release-gated
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Acquire and verify release package
        uses: ./.github/actions/verify-release-package
        with:
          artifact-id: ${{ needs.prepare-release.outputs.artifact_id }}
          package-sha256: ${{ needs.prepare-release.outputs.package_sha256 }}
          release-sha: ${{ needs.prepare-release.outputs.expect_build_version }}

      - name: Recheck production proofs before credentials
        if: needs.check-gates.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGES_CODE: 'true'
          CHANGES_MIGRATIONS: ${{ needs.changes.outputs.migrations }}
          PROD_GATE_MAX_AGE_HOURS: ${{ vars.PROD_GATE_MAX_AGE_HOURS }}
        run: node scripts/release/check-gates.mjs --sha "$(git rev-parse 'HEAD^{commit}')"


      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            .config/dotnet-tools.json

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore QueenZone.sln

      - name: Fetch Bitwarden deploy secrets
        id: bitwarden-secrets
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.BITWARDEN_SECRETS_MANAGER_ACCESS_TOKEN }}
          secrets: ${{ vars.BITWARDEN_APP_SERVICE_DEPLOY_SECRETS }}

      - name: Apply database migrations
        env:
          ConnectionStrings__QueenZoneLegacy: ${{ steps.bitwarden-secrets.outputs.QUEENZONE_LEGACY_MIGRATION_CONNECTION_STRING_CANADA_EAST }}
        run: |
          if [ -z "$ConnectionStrings__QueenZoneLegacy" ]; then
            echo "::error::QUEENZONE_LEGACY_MIGRATION_CONNECTION_STRING_CANADA_EAST is not configured. Check the Bitwarden secret and BITWARDEN_APP_SERVICE_DEPLOY_SECRETS mapping before deploying."
            exit 1
          fi

          dotnet ef database update \
            --project src/QueenZone.Data/QueenZone.Data.csproj \
            --startup-project src/QueenZone.Web/QueenZone.Web.csproj

  # WEBSITE_RUN_FROM_PACKAGE=1 (mount the zip read-only rather than extracting
  # it) was removed after it repeatedly served stale builds post-deploy: a
  # worker could pass the post-deploy build-stamp smoke check and then revert
  # to the previous build minutes later with no further restart logged,
  # consistent with the old worker not draining cleanly during the mount
  # handoff. Plain extract-mode deploys do not have this failure mode.
  # WEBSITE_WARMUP_PATH is still ARM-owned here (Kudu POST /api/settings
  # cannot persist ARM Application Settings — it returns 204 but does not
  # take effect, #660/#664), through a dedicated OIDC identity scoped to
  # Website Contributor on queenzone-prod only (#666/#1272), never through
  # scripts/Invoke-AppServiceKudu.py.
  #
  # WEBSITE_WARMUP_PATH points at /health, not /warmup. Azure's own container
  # startup probe must succeed within WEBSITES_CONTAINER_START_TIME_LIMIT
  # (default 230s) or the platform kills the container and retries. /warmup
  # runs dependency checks and primes public caches, so it is a deploy-time
  # readiness gate rather than the platform's container-liveness gate.
  # Pointing the platform probe at /warmup crash-looped
  # the former production app for over an hour on the first #666 rollout. /health stays
  # cheap (no dependency I/O) so it can't blow the platform's tight budget.
  # WEBSITE_WARMUP_STATUSES stays unset: App Service pings can carry an internal
  # link-local Host header, and the old ASP.NET Core host filter rejected that
  # before /health with 400. Requiring exactly 200 turned the rejection into a
  # 230-second crash loop (#684). The app now bypasses host validation for probe
  # paths, but accepting any HTTP response remains the safer platform liveness
  # contract; the post-deploy /warmup + route smoke below is the strict gate.
  # deploy.yml's own "Warm up custom domain" step still hits /warmup
  # directly afterward, with its own ~8 minute retry budget — that is the
  # right amount of patience for "are caches warm," not a platform gate.
  configure-app-settings:
    name: Configure ARM Application Settings
    runs-on: ubuntu-latest
    needs: [changes, prepare-release, check-gates, gate-override]
    if: |
      always() &&
      (github.event_name != 'workflow_dispatch' || inputs.gate_only != true) &&
      (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') &&
      needs.changes.outputs.code == 'true' &&
      needs.prepare-release.result == 'success' &&
      (needs.check-gates.result == 'success' || (needs.check-gates.result == 'skipped' && needs.gate-override.result == 'success'))
    # Production ARM/OIDC identity for App Service settings (#2291/#2294).
    # Custom policy: tags v* only. Distinct from prod-release-gated
    # (Bitwarden zip deploy) and from deploy-dev.yml's "dev-deploy".
    # Behind check-gates / gate-override. Do not use ungated prod-deploy
    # or legacy environment "deploy".
    environment: prod-deploy-gated
    permissions:
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Acquire and verify release package
        uses: ./.github/actions/verify-release-package
        with:
          artifact-id: ${{ needs.prepare-release.outputs.artifact_id }}
          package-sha256: ${{ needs.prepare-release.outputs.package_sha256 }}
          release-sha: ${{ needs.prepare-release.outputs.expect_build_version }}

      - name: Recheck production proofs before credentials
        if: needs.check-gates.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGES_CODE: 'true'
          CHANGES_MIGRATIONS: ${{ needs.changes.outputs.migrations }}
          PROD_GATE_MAX_AGE_HOURS: ${{ vars.PROD_GATE_MAX_AGE_HOURS }}
        run: node scripts/release/check-gates.mjs --sha "$(git rev-parse 'HEAD^{commit}')"

      - name: Fetch Bitwarden runtime secrets
        id: bitwarden-secrets
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.BITWARDEN_SECRETS_MANAGER_ACCESS_TOKEN }}
          secrets: ${{ vars.BITWARDEN_APP_SERVICE_DEPLOY_SECRETS }}

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      # az webapp config appsettings set restarts the SCM/Kudu container on
      # every call, whether or not the values actually changed — and this
      # job runs on every code deploy, not just the first flip. Writing
      # unconditionally would pay a 90s settle wait (see below) on every
      # deploy forever. Only write, and only wait, when the live settings
      # actually differ from the desired ones.
      - name: Check and set required application settings via ARM
        id: apply-settings
        env:
          MOBILE_AUTH_SIGNING_KEY: ${{ steps.bitwarden-secrets.outputs.MOBILE_AUTH_SIGNING_KEY }}
          GMAIL_APP_USERNAME: ${{ steps.bitwarden-secrets.outputs.GMAIL_APP_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ steps.bitwarden-secrets.outputs.GMAIL_APP_PASSWORD }}
        run: |
          if [ "${#MOBILE_AUTH_SIGNING_KEY}" -lt 32 ]; then
            echo "::error::MOBILE_AUTH_SIGNING_KEY must map to a Bitwarden secret of at least 32 characters."
            exit 1
          fi
          if [ -z "$GMAIL_APP_USERNAME" ] || [ -z "$GMAIL_APP_PASSWORD" ]; then
            echo "::error::Gmail SMTP Bitwarden mappings are missing."
            exit 1
          fi

          desired=$(printf '%s\n' \
            "WEBSITE_WARMUP_PATH=/health" | sort)

          current=$(az webapp config appsettings list \
            --name queenzone-prod \
            --resource-group Queenzone-RG \
            --query "[?name=='WEBSITE_WARMUP_PATH'].[join('=', [name, value])]" \
            -o tsv | tr -d '\r' | sort)

          strict_warmup_status=$(az webapp config appsettings list \
            --name queenzone-prod \
            --resource-group Queenzone-RG \
            --query "[?name=='WEBSITE_WARMUP_STATUSES'].value | [0]" \
            -o tsv | tr -d '\r')

          # Kept absent by design (see comment above): a stale WEBSITE_RUN_FROM_PACKAGE=1
          # from before this removal must not linger and re-enable the read-only mount.
          run_from_package=$(az webapp config appsettings list \
            --name queenzone-prod \
            --resource-group Queenzone-RG \
            --query "[?name=='WEBSITE_RUN_FROM_PACKAGE'].value | [0]" \
            -o tsv | tr -d '\r')

          current_mobile_auth_signing_key=$(az webapp config appsettings list \
            --name queenzone-prod \
            --resource-group Queenzone-RG \
            --query "[?name=='MobileAuth__SigningKey'].value | [0]" \
            -o tsv | tr -d '\r')

          desired_smtp=$(printf '%s\n' \
            "SmtpEmail__Username=$GMAIL_APP_USERNAME" \
            "SmtpEmail__AppPassword=$GMAIL_APP_PASSWORD" \
            "SmtpEmail__FromAddress=support@queenzone.org" | sort)
          current_smtp=$(az webapp config appsettings list \
            --name queenzone-prod \
            --resource-group Queenzone-RG \
            --query "[?name=='SmtpEmail__Username' || name=='SmtpEmail__AppPassword' || name=='SmtpEmail__FromAddress'].[join('=', [name, value])]" \
            -o tsv | tr -d '\r' | sort)

          changed=false
          if [ -n "$strict_warmup_status" ]; then
            az webapp config appsettings delete \
              --name queenzone-prod \
              --resource-group Queenzone-RG \
              --setting-names WEBSITE_WARMUP_STATUSES \
              --output none
            changed=true
          fi

          if [ -n "$run_from_package" ]; then
            az webapp config appsettings delete \
              --name queenzone-prod \
              --resource-group Queenzone-RG \
              --setting-names WEBSITE_RUN_FROM_PACKAGE \
              --output none
            changed=true
          fi

          if [ "$current" != "$desired" ]; then
            az webapp config appsettings set \
              --name queenzone-prod \
              --resource-group Queenzone-RG \
              --settings WEBSITE_WARMUP_PATH=/health \
              --output none
            changed=true
          fi

          if [ "$current_mobile_auth_signing_key" != "$MOBILE_AUTH_SIGNING_KEY" ]; then
            az webapp config appsettings set \
              --name queenzone-prod \
              --resource-group Queenzone-RG \
              --settings "MobileAuth__SigningKey=$MOBILE_AUTH_SIGNING_KEY" \
              --output none
            changed=true
          fi

          if [ "$current_smtp" != "$desired_smtp" ]; then
            az webapp config appsettings set \
              --name queenzone-prod \
              --resource-group Queenzone-RG \
              --settings \
                "SmtpEmail__Username=$GMAIL_APP_USERNAME" \
                "SmtpEmail__AppPassword=$GMAIL_APP_PASSWORD" \
                "SmtpEmail__FromAddress=support@queenzone.org" \
              --output none
            changed=true
          fi

          if [ "$changed" = "false" ]; then
            echo "Settings already match; skipping write and restart wait."
          else
            echo "Settings updated; waiting for the resulting SCM restart before deploy."
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      # Only needed right after an actual settings write: Kudu killed the
      # in-flight OneDeploy on the #666 rollout run when the zip push started
      # ~25s after a settings write ("Deployment has been stopped due to SCM
      # container restart... Do not perform a management operation and a
      # deployment operation in quick succession"). Azure's own fix is the
      # delay it recommends.
      - name: Wait for SCM container to settle after the settings write
        if: steps.apply-settings.outputs.changed == 'true'
        run: sleep 90

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [changes, prepare-release, migrate, configure-app-settings, check-gates, gate-override]
    # migrate is skipped on non-EF pushes; treat skipped as success so the
    # zip deploy still runs (issue #659).
    if: |
      always() &&
      (github.event_name != 'workflow_dispatch' || inputs.gate_only != true) &&
      (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') &&
      needs.changes.outputs.code == 'true' &&
      needs.prepare-release.result == 'success' &&
      needs.configure-app-settings.result == 'success' &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') &&
      (needs.check-gates.result == 'success' || (needs.check-gates.result == 'skipped' && needs.gate-override.result == 'success'))
    # Same prod-release-gated environment as migrate (Bitwarden publish
    # profile). Behind check-gates / gate-override. url below is the public
    # production site, not a GitHub Environment name.
    environment:
      name: prod-release-gated
      url: https://www.queenzone.org
    # A stuck azure/webapps-deploy poll (e.g. hitting the SCM-restart race
    # this job now waits out) had no bound and hung for ~20 minutes before a
    # manual cancel on the #666 rollout run. Fail loudly instead.
    # Package preparation already completed without production credentials.
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Acquire and verify release package
        uses: ./.github/actions/verify-release-package
        with:
          artifact-id: ${{ needs.prepare-release.outputs.artifact_id }}
          package-sha256: ${{ needs.prepare-release.outputs.package_sha256 }}
          release-sha: ${{ needs.prepare-release.outputs.expect_build_version }}

      - name: Recheck production proofs before credentials
        if: needs.check-gates.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGES_CODE: 'true'
          CHANGES_MIGRATIONS: ${{ needs.changes.outputs.migrations }}
          PROD_GATE_MAX_AGE_HOURS: ${{ vars.PROD_GATE_MAX_AGE_HOURS }}
        run: node scripts/release/check-gates.mjs --sha "$(git rev-parse 'HEAD^{commit}')"


      - name: Extract verified release package
        run: |
          mkdir publish
          tar -xzf release-input/release-package.tar.gz -C publish

      - name: Fetch Bitwarden deploy secrets
        id: bitwarden-secrets
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.BITWARDEN_SECRETS_MANAGER_ACCESS_TOKEN }}
          secrets: ${{ vars.BITWARDEN_APP_SERVICE_DEPLOY_SECRETS }}

      - name: Azure login for temporary SCM access
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: Allow this runner to reach SCM
        id: open-scm
        env:
          SCM_RULE_NAME: github-deploy-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          ip=$(curl --fail --silent --show-error --retry 3 https://api.ipify.org)
          python3 - "$ip" <<'PY'
          import ipaddress
          import sys

          if ipaddress.ip_address(sys.argv[1]).version != 4:
              raise SystemExit("Expected a single IPv4 address for this GitHub runner")
          PY
          az webapp config access-restriction add \
            --name queenzone-prod --resource-group Queenzone-RG \
            --scm-site true --rule-name "$SCM_RULE_NAME" \
            --action Allow --ip-address "$ip/32" --priority 100 \
            --only-show-errors --output none
          echo "rule-name=$SCM_RULE_NAME" >> "$GITHUB_OUTPUT"
          for attempt in {1..30}; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              https://queenzone-prod.scm.azurewebsites.net/api/settings || true)
            if [ "$status" = 401 ]; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::SCM did not become reachable from this runner (last HTTP $status)."
              exit 1
            fi
            sleep 2
          done

      - name: Deploy
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: queenzone-prod
          publish-profile: ${{ steps.bitwarden-secrets.outputs.AZURE_WEBAPP_PUBLISH_PROFILE_CANADA_EAST }}
          package: publish

      # An explicit Kudu restart after the zip push is required for a worker
      # that can finish /warmup — skipping it after #688 left /warmup on HTTP
      # 500 empty and / flaking until the deploy job was cancelled. Keep the
      # stamp check as the strict readiness gate regardless of extract mode.
      - name: Recycle App Service
        env:
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ steps.bitwarden-secrets.outputs.AZURE_WEBAPP_PUBLISH_PROFILE_CANADA_EAST }}
        run: python3 ./scripts/Invoke-AppServiceKudu.py --restart

      - name: Remove temporary SCM access
        if: always() && steps.open-scm.outputs.rule-name != ''
        env:
          SCM_RULE_NAME: ${{ steps.open-scm.outputs.rule-name }}
        run: |
          az webapp config access-restriction remove \
            --name queenzone-prod --resource-group Queenzone-RG \
            --scm-site true --rule-name "$SCM_RULE_NAME" \
            --only-show-errors --output none

      - name: Warm up custom domain
        run: |
          bash ./scripts/Invoke-PostDeploySmoke.sh \
            --warmup-only \
            --expect-build-version "${{ needs.prepare-release.outputs.expect_build_version }}"

  post-deploy-smoke:
    name: Post-deploy smoke
    runs-on: ubuntu-latest
    needs: [changes, prepare-release, deploy, check-gates, gate-override]
    # always() is required: migrate is skipped on non-EF pushes, and GitHub
    # then skips every descendant that does not opt out of that cascade —
    # even when `deploy` itself ran (run 31702420754 after #660).
    if: |
      always() &&
      (github.event_name != 'workflow_dispatch' || inputs.gate_only != true) &&
      (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') &&
      needs.changes.outputs.code == 'true' &&
      needs.prepare-release.result == 'success' &&
      needs.deploy.result == 'success' &&
      (needs.check-gates.result == 'success' || (needs.check-gates.result == 'skipped' && needs.gate-override.result == 'success'))
    # Allow retry loop (~8 min) plus request time; avoid false fails during App Service recycle.
    timeout-minutes: 12
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Smoke the public custom domain (Site:PublicBaseUrl), not only the App Service hostname.
      # /health alone is liveness only — content pages can still 500 during recycle/warmup.
      # The deploy job already polled /warmup and the new build stamp; this job
      # still starts with warmup then the content-route suite. A failure fails
      # the job so watchers get mail.
      - name: Post-deploy smoke (custom domain)
        run: |
          bash ./scripts/Invoke-PostDeploySmoke.sh \
            --expect-build-version "${{ needs.prepare-release.outputs.expect_build_version }}"
