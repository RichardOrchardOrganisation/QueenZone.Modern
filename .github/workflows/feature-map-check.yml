name: Feature map check

on:
  pull_request:
  merge_group:
    types: [checks_requested]
    branches: [main]

permissions:
  contents: read

jobs:
  feature-map:
    name: Feature map coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Check feature map
        run: node scripts/check-feature-map.mjs
