name: Gardener

on:
  schedule:
    # Monday 00:00 UTC = 08:00 Perth.
    - cron: "0 0 * * 1"
    # Metadata-only deployment queue inspection; weekly gardener stays weekly.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: Days of history to scan (weekly default 7)
        type: string
        default: "7"
      max_issues:
        description: Max new issues this run
        type: string
        default: "2"
      dry_run:
        description: Print the plan without writing issues
        type: boolean
        default: true
      ingest_findings:
        description: Ingest committed 60-day classified review findings (scripts/issue-filer/review-findings-60d.json)
        type: boolean
        default: false

concurrency:
  group: issue-filer
  cancel-in-progress: false

permissions: {}

jobs:
  gardener:
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: read
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 0 * * 1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Run gardener
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          LOOKBACK_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.lookback_days || '7' }}
          MAX_ISSUES: ${{ github.event_name == 'workflow_dispatch' && inputs.max_issues || '2' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          INGEST_FINDINGS: ${{ github.event_name == 'workflow_dispatch' && inputs.ingest_findings }}
        run: |
          extra=()
          if [ "${DRY_RUN}" = "true" ]; then
            extra+=(--dry-run)
          fi
          if [ "${INGEST_FINDINGS}" = "true" ]; then
            extra+=(--ingest-findings)
          fi
          node scripts/issue-filer/run.mjs \
            --loop gardener \
            --lookback-days "${LOOKBACK_DAYS}" \
            --max-issues "${MAX_ISSUES}" \
            "${extra[@]}"

  deployment-queue:
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: read
    name: Inspect dev deployment queue
    if: github.event_name == 'schedule' && github.event.schedule == '23 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Report aged unassigned deployment jobs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEMETRY_TRIAGE_FILE_ISSUES: ${{ vars.TELEMETRY_TRIAGE_FILE_ISSUES }}
        run: node scripts/issue-filer/deployment-queue.mjs
