# Phase 1 device smoke (#872 Option A) plus on-demand journeys (#1071).
# Not a required PR check. Do not silently enable branch protection.
# Weekday 04:00 UTC stays smoke only. Journeys use dispatch and weekday 16:00 UTC.
#
# Device smoke/journeys install a Release-embedded binary (JS bundle baked in).
# Never assembleDebug / Debug-iphonesimulator — that is an expo-dev-client
# launcher waiting for Metro (#1322). Do not host Metro in Actions.
name: Mobile device smoke

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Maestro suite to run (smoke stays the 9 #872 flows)"
        required: false
        type: choice
        options:
          - smoke
          - journeys
          - release
          - both
        default: smoke
      platform:
        description: "Device platform to run"
        required: false
        type: choice
        options:
          - both
          - android
          - ios
        default: both
      prove_failure:
        description: "Run the forced-assertion flow to prove failure artifacts (smoke only)"
        required: false
        type: boolean
        default: false
  schedule:
    # After nightly-legacy-checks (03:00 UTC). Weekdays only for Phase 1 soak.
    - cron: "0 4 * * 1-5"
    # Later weekday slot for journeys. Do not steal the 04:00 smoke slot.
    - cron: "0 16 * * 1-5"

permissions:
  contents: read

concurrency:
  group: mobile-device-${{ github.event.inputs.suite || github.event.schedule || 'smoke' }}-${{ github.event.inputs.platform || 'both' }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
  SMOKE_PORT: "5098"
  # Android smoke (#1454) uses the self-hosted Mac + isolated AVD/port.
  # Hosted ubuntu-latest qemu still dies intermittently (transport_death /
  # emulator-gone, not OOM). Journeys stay on that hosted path. P0 release
  # keeps QueenZone_CI_API_36 on port 5556 and is not this smoke AVD.

jobs:
  mobile-android-smoke:
    name: Mobile Android device smoke
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 4 * * 1-5')
      || (github.event_name == 'workflow_dispatch'
        && (github.event.inputs.suite == 'smoke' || github.event.inputs.suite == 'both')
        && (github.event.inputs.platform == 'android' || github.event.inputs.platform == 'both'))
    # Same labels as P0 Android release. Isolated AVD/port in the smoke wrapper.
    # Reversible: previous path was GitHub-hosted Linux qemu.
    runs-on: [self-hosted, macOS, ARM64, queenzone]
    timeout-minutes: 90
    defaults:
      run:
        working-directory: src/QueenZone.Mobile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            .config/dotnet-tools.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/QueenZone.Mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Export installed Android SDK
        working-directory: .
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Library/Android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK not found at $SDK_ROOT."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install mobile JS
        run: npm ci

      - name: Build Testing web host
        working-directory: .
        run: |
          unset ConnectionStrings__QueenZoneLegacy || true
          unset ConnectionStrings__BlobStorage || true
          unset ConnectionStrings__SqlServerTest || true
          dotnet build src/QueenZone.Web/QueenZone.Web.csproj --configuration Release

      - name: Preinstall Android NDK 27.1.12297006
        working-directory: .
        run: ./scripts/preinstall-android-ndk.sh

      - name: Assemble Android Release smoke APK
        env:
          EXPO_PUBLIC_APP_ENV: development
          EXPO_PUBLIC_API_BASE_URL: http://10.0.2.2:5098
          EXPO_PUBLIC_SMOKE_EMBED: "1"
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
          QUEENZONE_MOBILE_SMOKE_EMBED: "1"
          FORCE_BUNDLING: "1"
        run: |
          npx expo prebuild --platform android
          cd android
          ./gradlew assembleRelease
          ./gradlew --stop

      - name: Install Maestro
        working-directory: .
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.maestro/bin:$PATH"
          if ! command -v maestro >/dev/null; then
            echo "::error::Maestro install finished but maestro is not on PATH ($HOME/.maestro/bin)."
            ls -la "$HOME/.maestro/bin" || true
            exit 1
          fi
          maestro --version

      # Compute prove_failure in this prior run step (schedule has no inputs,
      # so default is off) (#1225).
      - name: Prepare Android smoke harness
        working-directory: .
        run: |
          mkdir -p src/QueenZone.Mobile/maestro-results
          {
            echo "event_name=${GITHUB_EVENT_NAME}"
            echo "job=mobile-android-smoke"
            echo "prepared_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > src/QueenZone.Mobile/maestro-results/harness.log
          if [ "${{ github.event.inputs.prove_failure }}" = "true" ]; then
            echo "PROVE_FAILURE_ARGS=--prove-failure" >> "$GITHUB_ENV"
          else
            echo "PROVE_FAILURE_ARGS=" >> "$GITHUB_ENV"
          fi

      - name: Run Android device smoke
        id: android-smoke
        continue-on-error: true
        working-directory: .
        env:
          ANDROID_SMOKE_AVD: QueenZone_CI_Smoke_API_36
          ANDROID_SMOKE_EMULATOR_PORT: "5558"
        run: |
          unset ConnectionStrings__QueenZoneLegacy || true
          unset ConnectionStrings__BlobStorage || true
          unset ConnectionStrings__SqlServerTest || true
          ./scripts/run-mobile-android-smoke-self-hosted.sh \
            src/QueenZone.Mobile/android/app/build/outputs/apk/release/app-release.apk \
            $PROVE_FAILURE_ARGS

      # hashFiles() is evaluated at job start, so classify from the marker the
      # script writes. Retry boots a new AVD (QueenZone_CI_Smoke_API_36_retry)
      # on the same isolated port; do not add a third identical attempt.
      # In-process ADB recovery cannot revive a dead emulator (#1432 / #1454).
      - name: Classify Android smoke transport death
        id: android-smoke-classify
        if: steps.android-smoke.outcome == 'failure'
        working-directory: .
        run: |
          MARKER=src/QueenZone.Mobile/maestro-results/android-transport-death
          if [ -f "$MARKER" ]; then
            echo "retry=true" >> "$GITHUB_OUTPUT"
            echo "First Android smoke attempt died on device transport. Retrying once with a fresh emulator."
            rm -rf src/QueenZone.Mobile/maestro-results-transport-first
            mkdir -p src/QueenZone.Mobile/maestro-results-transport-first
            cp -a src/QueenZone.Mobile/maestro-results/. src/QueenZone.Mobile/maestro-results-transport-first/
            # Fresh-emulator rerun must not inherit the first-attempt marker
            # or tee -a console, or a later selector miss looks like transport.
            rm -rf src/QueenZone.Mobile/maestro-results
            mkdir -p src/QueenZone.Mobile/maestro-results
          else
            echo "retry=false" >> "$GITHUB_OUTPUT"
            echo "First Android smoke attempt was a selector or assertion miss. Not retrying."
          fi

      - name: Retry Android device smoke after transport death
        id: android-smoke-retry
        if: steps.android-smoke-classify.outputs.retry == 'true'
        working-directory: .
        env:
          ANDROID_SMOKE_AVD: QueenZone_CI_Smoke_API_36_retry
          ANDROID_SMOKE_EMULATOR_PORT: "5558"
          ANDROID_SMOKE_FORCE_AVD: "1"
        run: |
          unset ConnectionStrings__QueenZoneLegacy || true
          unset ConnectionStrings__BlobStorage || true
          unset ConnectionStrings__SqlServerTest || true
          ./scripts/run-mobile-android-smoke-self-hosted.sh \
            src/QueenZone.Mobile/android/app/build/outputs/apk/release/app-release.apk \
            $PROVE_FAILURE_ARGS

      - name: Collect leftover Android smoke logs
        if: >-
          always()
          && steps.android-smoke.outcome == 'failure'
          && steps.android-smoke-retry.outcome != 'success'
        timeout-minutes: 2
        working-directory: .
        run: |
          mkdir -p src/QueenZone.Mobile/maestro-results
          if [ ! -s src/QueenZone.Mobile/maestro-results/harness.log ]; then
            echo "assemble failed before the smoke script wrote harness.log" > src/QueenZone.Mobile/maestro-results/harness.log
          fi
          ./scripts/run-mobile-device-smoke.sh --dump-android-host --results-dir src/QueenZone.Mobile/maestro-results
          if [ ! -s src/QueenZone.Mobile/maestro-results/logcat.txt ]; then
            timeout 30 adb logcat -d > src/QueenZone.Mobile/maestro-results/logcat.txt 2>/dev/null || true
          fi
          for f in "$HOME"/.android/*.log "$HOME"/.android/avd/*/*.log; do
            [ -f "$f" ] || continue
            cp "$f" "src/QueenZone.Mobile/maestro-results/$(basename "$f")" || true
          done

      - name: Upload Android smoke diagnostics
        if: >-
          always()
          && steps.android-smoke.outcome == 'failure'
          && steps.android-smoke-retry.outcome != 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-android-smoke-${{ github.run_id }}
          path: |
            src/QueenZone.Mobile/maestro-results/
            src/QueenZone.Mobile/maestro-results-transport-first/
          if-no-files-found: error
          retention-days: 7

      - name: Fail Android smoke after unrecovered failure
        if: >-
          always()
          && steps.android-smoke.outcome == 'failure'
          && steps.android-smoke-retry.outcome != 'success'
        working-directory: .
        run: |
          if [ -f src/QueenZone.Mobile/maestro-results/android-transport-death ] \
            || [ -f src/QueenZone.Mobile/maestro-results-transport-first/android-transport-death ]; then
            echo "::error::Android smoke failed after device transport death (emulator/Maestro device server). Not a selector miss."
          else
            echo "::error::Android smoke failed on a selector or assertion miss."
          fi
          exit 1

  mobile-ios-smoke:
    name: Mobile iOS device smoke
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 4 * * 1-5')
      || (github.event_name == 'workflow_dispatch'
        && (github.event.inputs.suite == 'smoke' || github.event.inputs.suite == 'both')
        && (github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'both'))
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: src/QueenZone.Mobile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select latest available Xcode
        working-directory: .
        run: |
          ls /Applications | grep -i Xcode
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$LATEST" ]; then
            echo "::error::No /Applications/Xcode_*.app found on this runner."
            exit 1
          fi
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            .config/dotnet-tools.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/QueenZone.Mobile/package-lock.json

      - name: Install mobile JS
        run: npm ci

      - name: Cache CocoaPods
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-smoke-${{ runner.os }}-${{ hashFiles('src/QueenZone.Mobile/package-lock.json') }}
          restore-keys: |
            cocoapods-smoke-${{ runner.os }}-

      - name: Build Testing web host
        working-directory: .
        run: |
          unset ConnectionStrings__QueenZoneLegacy || true
          unset ConnectionStrings__BlobStorage || true
          unset ConnectionStrings__SqlServerTest || true
          dotnet build src/QueenZone.Web/QueenZone.Web.csproj --configuration Release

      - name: Build iOS Simulator Release smoke app
        env:
          EXPO_PUBLIC_APP_ENV: development
          EXPO_PUBLIC_API_BASE_URL: http://127.0.0.1:5098
          EXPO_PUBLIC_SMOKE_EMBED: "1"
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
          QUEENZONE_MOBILE_SMOKE_EMBED: "1"
          FORCE_BUNDLING: "1"
        run: |
          npx expo prebuild --platform ios --clean
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Install Maestro
        working-directory: .
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.maestro/bin:$PATH"
          if ! command -v maestro >/dev/null; then
            echo "::error::Maestro install finished but maestro is not on PATH ($HOME/.maestro/bin)."
            ls -la "$HOME/.maestro/bin" || true
            exit 1
          fi
          maestro --version

      - name: Boot iPhone Simulator
        working-directory: .
        run: |
          UDID=$(xcrun simctl list devices available | grep iPhone | grep -oE '[0-9A-F-]{36}' | head -n 1)
          if [ -z "$UDID" ]; then
            echo "::error::No available iPhone Simulator runtime."
            xcrun simctl list devices
            exit 1
          fi
          echo "Booting $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "IOS_SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Run iOS device smoke
        working-directory: .
        run: |
          PROVE=""
          if [ "${{ github.event.inputs.prove_failure }}" = "true" ]; then
            PROVE="--prove-failure"
          fi
          unset ConnectionStrings__QueenZoneLegacy || true
          unset ConnectionStrings__BlobStorage || true
          unset ConnectionStrings__SqlServerTest || true
          APP=$(ls -d src/QueenZone.Mobile/ios/build/Build/Products/Release-iphonesimulator/*.app | head -n 1)
          ./scripts/run-mobile-device-smoke.sh \
            --platform ios \
            --skip-build \
            --no-build \
            --app "$APP" \
            $PROVE

      - name: Upload iOS smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-ios-smoke-${{ github.run_id }}
          path: |
            src/QueenZone.Mobile/maestro-results/
          if-no-files-found: ignore
          retention-days: 7

  mobile-android-journeys:
    name: Mobile Android extended device suite
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 16 * * 1-5')
      || (github.event_name == 'workflow_dispatch'
        && (github.event.inputs.suite == 'journeys' || github.event.inputs.suite == 'both')
        && (github.event.inputs.platform == 'android' || github.event.inputs.platform == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: src/QueenZone.Mobile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            .config/dotnet-tools.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/QueenZone.Mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
        working-directory: .

      - name: Install mobile JS
        run: npm ci

      - name: Build Testing web host
        working-directory: .
        run: |
          unset ConnectionStrings__QueenZoneLegacy || true
          unset ConnectionStrings__BlobStorage || true
          unset ConnectionStrings__SqlServerTest || true
          dotnet build src/QueenZone.Web/QueenZone.Web.csproj --configuration Release

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-smoke-${{ runner.os }}-${{ hashFiles('src/QueenZone.Mobile/package-lock.json') }}
          restore-keys: |
            gradle-smoke-${{ runner.os }}-

      - name: Preinstall Android NDK 27.1.12297006
        working-directory: .
        run: ./scripts/preinstall-android-ndk.sh

      - name: Assemble Android Release smoke APK
        env:
          EXPO_PUBLIC_APP_ENV: development
          EXPO_PUBLIC_API_BASE_URL: http://10.0.2.2:5098
          EXPO_PUBLIC_SMOKE_EMBED: "1"
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
          QUEENZONE_MOBILE_SMOKE_EMBED: "1"
          FORCE_BUNDLING: "1"
        run: |
          npx expo prebuild --platform android
          cd android
          ./gradlew assembleRelease
          ./gradlew --stop

      - name: Install Maestro
        working-directory: .
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.maestro/bin:$PATH"
          if ! command -v maestro >/dev/null; then
            echo "::error::Maestro install finished but maestro is not on PATH ($HOME/.maestro/bin)."
            ls -la "$HOME/.maestro/bin" || true
            exit 1
          fi
          maestro --version

      - name: Prepare Android journeys harness
        working-directory: .
        run: |
          mkdir -p src/QueenZone.Mobile/maestro-results
          {
            echo "event_name=${GITHUB_EVENT_NAME}"
            echo "job=mobile-android-journeys"
            echo "prepared_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > src/QueenZone.Mobile/maestro-results/harness.log
          echo "DEVICE_SUITE_ARGS=--suite journeys" >> "$GITHUB_ENV"

      # Hosted GHA Linux only: API 34 + stable emulator channel (#1458).
      - name: Run Android device journeys
        id: android-journeys
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          channel: stable
          target: google_apis
          arch: x86_64
          cores: 3
          ram-size: 4096M
          heap-size: 512M
          force-avd-creation: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./scripts/run-mobile-device-smoke.sh --platform android $DEVICE_SUITE_ARGS --skip-build --no-build --apk src/QueenZone.Mobile/android/app/build/outputs/apk/release/app-release.apk

      - name: Classify Android journeys transport death
        id: android-journeys-classify
        if: steps.android-journeys.outcome == 'failure'
        working-directory: .
        run: |
          MARKER=src/QueenZone.Mobile/maestro-results/android-transport-death
          if [ -f "$MARKER" ]; then
            echo "retry=true" >> "$GITHUB_OUTPUT"
            echo "First Android journeys attempt died on device transport. Retrying once with a fresh emulator."
            rm -rf src/QueenZone.Mobile/maestro-results-transport-first
            mkdir -p src/QueenZone.Mobile/maestro-results-transport-first
            cp -a src/QueenZone.Mobile/maestro-results/. src/QueenZone.Mobile/maestro-results-transport-first/
            rm -rf src/QueenZone.Mobile/maestro-results
            mkdir -p src/QueenZone.Mobile/maestro-results
          else
            echo "retry=false" >> "$GITHUB_OUTPUT"
            echo "First Android journeys attempt was a selector or assertion miss. Not retrying."
          fi

      - name: Retry Android device journeys after transport death
        id: android-journeys-retry
        if: steps.android-journeys-classify.outputs.retry == 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          channel: stable
          target: google_apis
          arch: x86_64
          cores: 3
          ram-size: 4096M
          heap-size: 512M
          avd-name: test-retry
          force-avd-creation: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./scripts/run-mobile-device-smoke.sh --platform android $DEVICE_SUITE_ARGS --skip-build --no-build --apk src/QueenZone.Mobile/android/app/build/outputs/apk/release/app-release.apk

      - name: Collect leftover Android journeys logs
        if: >-
          always()
          && steps.android-journeys.outcome == 'failure'
          && steps.android-journeys-retry.outcome != 'success'
        timeout-minutes: 2
        working-directory: .
        run: |
          mkdir -p src/QueenZone.Mobile/maestro-results
          if [ ! -s src/QueenZone.Mobile/maestro-results/harness.log ]; then
            echo "assemble failed before the smoke script wrote harness.log" > src/QueenZone.Mobile/maestro-results/harness.log
          fi
          ./scripts/run-mobile-device-smoke.sh --dump-android-host --results-dir src/QueenZone.Mobile/maestro-results
          if [ ! -s src/QueenZone.Mobile/maestro-results/logcat.txt ]; then
            timeout 30 adb logcat -d > src/QueenZone.Mobile/maestro-results/logcat.txt 2>/dev/null || true
          fi
          for f in "$HOME"/.android/*.log "$HOME"/.android/avd/*/*.log; do
            [ -f "$f" ] || continue
            cp "$f" "src/QueenZone.Mobile/maestro-results/$(basename "$f")" || true
          done

      - name: Upload Android journeys diagnostics
        if: >-
          always()
          && steps.android-journeys.outcome == 'failure'
          && steps.android-journeys-retry.outcome != 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-android-journeys-${{ github.run_id }}
          path: |
            src/QueenZone.Mobile/maestro-results/
            src/QueenZone.Mobile/maestro-results-transport-first/
          if-no-files-found: error
          retention-days: 7

      - name: Fail Android journeys after unrecovered failure
        if: >-
          always()
          && steps.android-journeys.outcome == 'failure'
          && steps.android-journeys-retry.outcome != 'success'
        working-directory: .
        run: |
          if [ -f src/QueenZone.Mobile/maestro-results/android-transport-death ] \
            || [ -f src/QueenZone.Mobile/maestro-results-transport-first/android-transport-death ]; then
            echo "::error::Android journeys failed after device transport death (emulator/Maestro device server). Not a selector miss."
          else
            echo "::error::Android journeys failed on a selector or assertion miss."
          fi
          exit 1

  mobile-android-release:
    name: Mobile Android P0 release suite
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.event.inputs.suite == 'release'
      && (github.event.inputs.platform == 'android' || github.event.inputs.platform == 'both')
    runs-on: [self-hosted, macOS, ARM64, queenzone]
    timeout-minutes: 90
    defaults:
      run:
        working-directory: src/QueenZone.Mobile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            .config/dotnet-tools.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/QueenZone.Mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Export installed Android SDK
        working-directory: .
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Library/Android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK not found at $SDK_ROOT."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install mobile JS
        run: npm ci

      - name: Prepare Android release diagnostics
        working-directory: .
        run: |
          mkdir -p src/QueenZone.Mobile/maestro-results
          echo "job=mobile-android-release" > src/QueenZone.Mobile/maestro-results/harness.log

      - name: Build Testing web host
        working-directory: .
        run: |
          unset ConnectionStrings__QueenZoneLegacy || true
          unset ConnectionStrings__BlobStorage || true
          unset ConnectionStrings__SqlServerTest || true
          dotnet build src/QueenZone.Web/QueenZone.Web.csproj --configuration Release

      - name: Preinstall Android NDK 27.1.12297006
        working-directory: .
        run: ./scripts/preinstall-android-ndk.sh

      - name: Assemble Android Release smoke APK
        env:
          EXPO_PUBLIC_APP_ENV: development
          EXPO_PUBLIC_API_BASE_URL: http://10.0.2.2:5098
          EXPO_PUBLIC_SMOKE_EMBED: "1"
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
          QUEENZONE_MOBILE_SMOKE_EMBED: "1"
          FORCE_BUNDLING: "1"
        run: |
          npx expo prebuild --platform android
          cd android
          ./gradlew assembleRelease
          ./gradlew --stop

      - name: Install Maestro
        working-directory: .
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.maestro/bin:$PATH"
          maestro --version

      - name: Run Android P0 release suite
        working-directory: .
        run: |
          unset ConnectionStrings__QueenZoneLegacy || true
          unset ConnectionStrings__BlobStorage || true
          unset ConnectionStrings__SqlServerTest || true
          ./scripts/run-mobile-android-release-self-hosted.sh \
            src/QueenZone.Mobile/android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Android release diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-android-release-${{ github.run_id }}
          path: |
            src/QueenZone.Mobile/maestro-results/
          if-no-files-found: error
          retention-days: 7

  mobile-ios-journeys:
    name: Mobile iOS extended device suite
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 16 * * 1-5')
      || (github.event_name == 'workflow_dispatch'
        && (github.event.inputs.suite == 'journeys'
          || github.event.inputs.suite == 'release'
          || github.event.inputs.suite == 'both')
        && (github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'both'))
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: src/QueenZone.Mobile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select latest available Xcode
        working-directory: .
        run: |
          ls /Applications | grep -i Xcode
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$LATEST" ]; then
            echo "::error::No /Applications/Xcode_*.app found on this runner."
            exit 1
          fi
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            .config/dotnet-tools.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/QueenZone.Mobile/package-lock.json

      - name: Install mobile JS
        run: npm ci

      - name: Cache CocoaPods
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-smoke-${{ runner.os }}-${{ hashFiles('src/QueenZone.Mobile/package-lock.json') }}
          restore-keys: |
            cocoapods-smoke-${{ runner.os }}-

      - name: Build Testing web host
        working-directory: .
        run: |
          unset ConnectionStrings__QueenZoneLegacy || true
          unset ConnectionStrings__BlobStorage || true
          unset ConnectionStrings__SqlServerTest || true
          dotnet build src/QueenZone.Web/QueenZone.Web.csproj --configuration Release

      - name: Build iOS Simulator Release smoke app
        env:
          EXPO_PUBLIC_APP_ENV: development
          EXPO_PUBLIC_API_BASE_URL: http://127.0.0.1:5098
          EXPO_PUBLIC_SMOKE_EMBED: "1"
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
          QUEENZONE_MOBILE_SMOKE_EMBED: "1"
          FORCE_BUNDLING: "1"
        run: |
          npx expo prebuild --platform ios --clean
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Install Maestro
        working-directory: .
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.maestro/bin:$PATH"
          if ! command -v maestro >/dev/null; then
            echo "::error::Maestro install finished but maestro is not on PATH ($HOME/.maestro/bin)."
            ls -la "$HOME/.maestro/bin" || true
            exit 1
          fi
          maestro --version

      - name: Boot iPhone Simulator
        working-directory: .
        run: |
          UDID=$(xcrun simctl list devices available | grep iPhone | grep -oE '[0-9A-F-]{36}' | head -n 1)
          if [ -z "$UDID" ]; then
            echo "::error::No available iPhone Simulator runtime."
            xcrun simctl list devices
            exit 1
          fi
          echo "Booting $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "IOS_SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Run iOS device journeys
        working-directory: .
        run: |
          unset ConnectionStrings__QueenZoneLegacy || true
          unset ConnectionStrings__BlobStorage || true
          unset ConnectionStrings__SqlServerTest || true
          APP=$(ls -d src/QueenZone.Mobile/ios/build/Build/Products/Release-iphonesimulator/*.app | head -n 1)
          SUITE="journeys"
          if [ "${{ github.event.inputs.suite }}" = "release" ]; then
            SUITE="release"
          fi
          ./scripts/run-mobile-device-smoke.sh \
            --platform ios \
            --suite "$SUITE" \
            --skip-build \
            --no-build \
            --app "$APP"

      - name: Upload iOS journeys diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-ios-journeys-${{ github.run_id }}
          path: |
            src/QueenZone.Mobile/maestro-results/
          if-no-files-found: ignore
          retention-days: 7
