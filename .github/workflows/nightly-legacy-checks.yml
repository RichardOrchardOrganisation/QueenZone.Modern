name: Nightly legacy DB checks

on:
  schedule:
    # 03:00 UTC daily. Adjust here if that stops being a quiet window.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      run_full_url_probe:
        description: "Also fetch and triage a public URL against the mirror (no OpenRouter key)"
        required: false
        type: boolean
        default: false
      skip_sync:
        description: "Skip the DB sync and reuse the existing SQL Express mirror (currently saves about 25-30 minutes)"
        required: false
        type: boolean
        default: false
      category_filter:
        description: "Optional substring to narrow the real-data UI suite to matching test names (dotnet test FullyQualifiedName~<value>), e.g. PrivateMessaging"
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}

concurrency:
  group: nightly-legacy-checks
  cancel-in-progress: false

# The opt-in "*ProbeTests" classes in QueenZone.Web.Tests (see
# docs/architecture/testing-policy.md, "Data Integration Tests") exercise the
# real legacy SQL Server but are gated behind ConnectionStrings__QueenZoneLegacy
# and explicit write-probe flags, all unset in ci.yml. Normal PR tests remain
# database-free. This workflow runs read probes, self-cleaning write probes,
# and the real-data Playwright UI suite nightly, without putting the real
# legacy/deploy database on the PR merge path. It is continuous signal, like
# the probes it extends — it is not a required check on any PR, and
# deploy.yml does not depend on it.
#
# Everything runs against a same-day mirror on the Windows runner's local SQL
# Express (synced from the live Azure SQL DB via sqlpackage each run), not
# the live database directly — see scripts/Sync-LegacyDbToSqlExpress.ps1.
# The Mac runner reaches that SQL Express instance over the LAN.
#
# One-time prerequisites on the Windows runner before this workflow will
# succeed (not automated — see scripts/Enable-SqlExpressRemoteAccess.ps1
# for why):
#   1. Run scripts/Enable-SqlExpressRemoteAccess.ps1 as Administrator to open
#      SQL Express to LAN connections and create the queenzone_probe login.
#   2. Add that login's password to Bitwarden and to the
#      BITWARDEN_APP_SERVICE_DEPLOY_SECRETS mapping as
#      QUEENZONE_SQL_EXPRESS_PROBE_PASSWORD.
#   3. Optionally set the repo variable SQLEXPRESS_LAN_ADDRESS if the
#      Windows runner's LAN IP (currently 192.168.1.237, ideally a DHCP
#      reservation) ever changes.
#
# Sequence: sync-legacy-db -> legacy-read-probes -> legacy-write-probes ->
# ui-e2e-realdata -> residue-check. One workflow with explicit `needs`
# ordering, rather than a second workflow racing this one, so nothing can
# rebuild the mirror underneath a running UI suite.
#
# Production live-site read-only sweep lives in its own workflow
# (livesite-readonly-sweep.yml) — no DB, independent schedule, not a PR gate.
#
# Read probes run first. Self-cleaning write probes then exercise the same
# SQL Express mirror locally on the Windows runner. Their scripts reject
# Azure SQL and remote targets (the Mac's LAN address to that same mirror is
# allow-listed alongside localhost — see Assert-SqlExpressMirrorConnection.ps1).
# Admin news writes include EfAdminNewsRepositoryLegacyWriteProbeTests plus
# the Admin_news_* Facts in EfNewsSectionLiveProbeTests (via
# Probe-AdminNewsLegacyWrites.ps1). EfNewsDiscoveryPromotionLiveProbeTests
# stays opt-in until hardened (#503).
#
# ui-e2e-realdata then runs the TestCategory=RealData Playwright suite
# (scripts/Run-E2E.ps1 -Mode RealData) on both the Windows runner (localhost
# mirror, Integrated Security) and the Mac runner (mirror over LAN, the
# queenzone_probe SQL login) — the database only lives on the Windows box
# (glory11), but the UI suite itself needs coverage on both OSes.
#
# A final residue-check job — after both write probes and the UI suite, so it
# validates UI-test cleanup too — fails the workflow if any known probe or
# leaked web-test markers remain.
jobs:
  sync-legacy-db:
    name: Sync legacy DB to SQL Express
    # Must run where SQL Express lives (the import target is localhost) —
    # the Windows box, regardless of its weaker CPU.
    runs-on: [self-hosted, Windows]
    # workflow_dispatch's skip_sync input lets an on-demand run reuse the
    # existing mirror instead of paying the roughly 25-30 minute sqlpackage extract/publish.
    if: github.event_name != 'workflow_dispatch' || inputs.skip_sync != true
    # One successful extract/publish is ~25-30 minutes. Transient live-DB TCP
    # drops retry the failed phase up to 3 times inside the script (#1453);
    # this budget is room for those retries, not a substitute for retrying or
    # failing clearly. Do not treat a timeout raise as the fix.
    timeout-minutes: 110
    # Reads production Azure SQL only to refresh the disposable SQL Express
    # mirror (issue #1377 Option B). Custom policy: branch main. Do not give
    # this environment to probe / UI / cleanup jobs.
    environment: prod-data-read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore local dotnet tools (sqlpackage)
        run: dotnet tool restore

      - name: Verify SQLPackage process wrapper
        run: ./scripts/Sync-LegacyDbToSqlExpress.ps1 -SelfTest

      - name: Fetch Bitwarden deploy secrets
        id: bitwarden-secrets
        uses: bitwarden/sm-action@v3.0.1
        with:
          access_token: ${{ secrets.BITWARDEN_SECRETS_MANAGER_ACCESS_TOKEN }}
          secrets: ${{ vars.BITWARDEN_APP_SERVICE_DEPLOY_SECRETS }}

      - name: Sync live legacy DB into local SQL Express
        env:
          ConnectionStrings__QueenZoneLegacy: ${{ steps.bitwarden-secrets.outputs.QUEENZONE_LEGACY_MIGRATION_CONNECTION_STRING }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ConnectionStrings__QueenZoneLegacy)) {
            Write-Error "QUEENZONE_LEGACY_MIGRATION_CONNECTION_STRING is not configured. Check the Bitwarden secret and BITWARDEN_APP_SERVICE_DEPLOY_SECRETS mapping."
          }
          try {
            ./scripts/Sync-LegacyDbToSqlExpress.ps1
            if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) {
              throw "Sync-LegacyDbToSqlExpress.ps1 exited with code $LASTEXITCODE"
            }
          }
          catch {
            $message = $_.Exception.Message
            if ($message -match 'TCP/transport|forcibly closed|connection reset|transport-level|transport timeout') {
              Write-Host "::error title=Nightly Sync TCP/transport failure::Live Azure SQL TCP/transport drop during Extract or Publish. $message Downstream probe and RealData jobs will stay skipped."
            }
            else {
              Write-Host "::error title=Nightly Sync failed::$message"
            }
            throw
          }

  legacy-read-probes:
    name: Legacy SQL read probes
    needs: sync-legacy-db
    # sync-legacy-db can be skipped via workflow_dispatch's skip_sync input;
    # tolerate that instead of treating it like a failure.
    if: always() && (needs.sync-legacy-db.result == 'success' || needs.sync-legacy-db.result == 'skipped')
    # Runs on the Mac Mini (M2) rather than the Windows box (i3) or a
    # GitHub-hosted runner — this is unattended and not time-sensitive, and
    # the Mac has the most headroom of the three for a nightly job. Reaches
    # SQL Express on the Windows box over the LAN (see prerequisites above).
    runs-on: [self-hosted, queenzone]
    timeout-minutes: 20
    # No GitHub Environment: this job only reads the SQL Express mirror over
    # the LAN. Bitwarden supplies QUEENZONE_SQL_EXPRESS_PROBE_PASSWORD via
    # repository-level token/mapping — not prod-data-read.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify .NET SDK
        run: dotnet --version

      - name: Restore
        run: dotnet restore tests/QueenZone.Web.Tests/QueenZone.Web.Tests.csproj

      - name: Fetch Bitwarden deploy secrets
        id: bitwarden-secrets
        uses: bitwarden/sm-action@v3.0.1
        with:
          access_token: ${{ secrets.BITWARDEN_SECRETS_MANAGER_ACCESS_TOKEN }}
          secrets: ${{ vars.BITWARDEN_APP_SERVICE_DEPLOY_SECRETS }}

      - name: Run legacy SQL read-only probes against the SQL Express mirror
        env:
          SQLEXPRESS_LAN_ADDRESS: ${{ vars.SQLEXPRESS_LAN_ADDRESS || '192.168.1.237,1433' }}
          SQLEXPRESS_PROBE_PASSWORD: ${{ steps.bitwarden-secrets.outputs.QUEENZONE_SQL_EXPRESS_PROBE_PASSWORD }}
        run: |
          if [ -z "$SQLEXPRESS_PROBE_PASSWORD" ]; then
            echo "::error::QUEENZONE_SQL_EXPRESS_PROBE_PASSWORD is not configured. Check the Bitwarden secret and BITWARDEN_APP_SERVICE_DEPLOY_SECRETS mapping (see prerequisites above)."
            exit 1
          fi

          export ConnectionStrings__QueenZoneLegacy="Server=${SQLEXPRESS_LAN_ADDRESS};Database=queenzone_legacy_sync;User Id=queenzone_probe;Password=${SQLEXPRESS_PROBE_PASSWORD};TrustServerCertificate=True"

          dotnet test tests/QueenZone.Web.Tests/QueenZone.Web.Tests.csproj \
            --configuration Release \
            --filter "FullyQualifiedName=QueenZone.Web.Tests.EfAdminNewsRepositoryLegacyProbeTests.Probe_legacy_admin_news_repository_when_connection_configured|FullyQualifiedName=QueenZone.Web.Tests.EfNewsSectionLiveProbeTests.Public_news_probe_materializes_archive_detail_search_and_sitemap_when_connection_configured"

  legacy-write-probes:
    name: Legacy SQL self-cleaning write probes
    needs: [sync-legacy-db, legacy-read-probes]
    if: always() && needs.legacy-read-probes.result == 'success' && (needs.sync-legacy-db.result == 'success' || needs.sync-legacy-db.result == 'skipped')
    runs-on: [self-hosted, Windows]
    timeout-minutes: 30
    env:
      ConnectionStrings__QueenZoneLegacy: "Server=localhost\\SQLEXPRESS;Database=queenzone_legacy_sync;Integrated Security=True;TrustServerCertificate=True"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore
        run: dotnet restore tests/QueenZone.Web.Tests/QueenZone.Web.Tests.csproj

      - name: Run admin news and news-section write lifecycle probes
        env:
          RUN_LEGACY_WRITE_PROBE: "true"
        # Probe-AdminNewsLegacyWrites.ps1 asserts mirror-only targeting, then
        # runs EfAdminNewsRepositoryLegacyWriteProbeTests, the
        # EfNewsSectionLiveProbeTests.Admin_news_* write Facts, and the
        # self-seeding EfNewsDiscoveryPromotionLiveProbeTests.
        run: ./scripts/Probe-AdminNewsLegacyWrites.ps1

      - name: Run URL ingestion queue lifecycle probe
        env:
          RUN_NEWS_AGENT_URL_INGESTION_PROBE: "true"
        run: ./scripts/Probe-NewsAgentUrlIngestion.ps1

      - name: Run private messaging IDENTITY and lock probe
        env:
          RUN_PRIVATE_MESSAGE_PROBE: "true"
        run: ./scripts/Probe-PrivateMessaging.ps1

      - name: Run forum write probe
        env:
          RUN_FORUM_WRITE_PROBE: "true"
        run: ./scripts/Probe-ForumWrites.ps1

      - name: Run photo and article submission probes
        env:
          RUN_CONTENT_SUBMISSION_PROBE: "true"
        run: ./scripts/Probe-ContentSubmissions.ps1

      - name: Run member account create/login probe
        env:
          RUN_MEMBER_ACCOUNT_PROBE: "true"
        run: ./scripts/Probe-MemberAccounts.ps1

      - name: Run full URL fetch and triage probe
        if: github.event_name == 'workflow_dispatch' && inputs.run_full_url_probe
        env:
          RUN_NEWS_AGENT_URL_INGESTION_PROBE: "true"
        run: ./scripts/Probe-NewsAgentUrlIngestion.ps1 -Full

  ui-e2e-realdata:
    name: UI E2E RealData (${{ matrix.os }})
    needs: [sync-legacy-db, legacy-read-probes, legacy-write-probes]
    if: always() && needs.legacy-write-probes.result == 'success' && (needs.sync-legacy-db.result == 'success' || needs.sync-legacy-db.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Windows
            runner: '["self-hosted", "Windows"]'
          - os: macOS
            runner: '["self-hosted", "queenzone"]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 45
    # No GitHub Environment: Windows uses Integrated Security on localhost;
    # macOS fetches the mirror probe password from repository-level Bitwarden
    # mapping. Do not attach prod-data-read.

    steps:
      - name: Kill stray app processes from a previous run (Windows)
        if: matrix.os == 'Windows'
        run: |
          Get-Process -Name "QueenZone.Web" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Kill stray app processes from a previous run (macOS)
        if: matrix.os == 'macOS'
        run: pkill -f QueenZone.Web || true

      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify .NET SDK
        run: dotnet --version

      # The Mac has no Integrated Security path to the Windows box, so it
      # needs the queenzone_probe SQL login's password (same secret the
      # legacy-read-probes job already uses) to reach the mirror over LAN.
      - name: Fetch Bitwarden deploy secrets
        if: matrix.os == 'macOS'
        id: bitwarden-secrets
        uses: bitwarden/sm-action@v3.0.1
        with:
          access_token: ${{ secrets.BITWARDEN_SECRETS_MANAGER_ACCESS_TOKEN }}
          secrets: ${{ vars.BITWARDEN_APP_SERVICE_DEPLOY_SECRETS }}

      - name: Run real-data UI suite (Windows, local mirror)
        if: matrix.os == 'Windows'
        shell: powershell
        env:
          ASPNETCORE_ENVIRONMENT: E2E
          ConnectionStrings__QueenZoneLegacy: "Server=localhost\\SQLEXPRESS;Database=queenzone_legacy_sync;Integrated Security=True;TrustServerCertificate=True"
          E2E_ADMIN_EMAIL: admin@test.local
          E2E_ARTIFACT_DIR: test-results/e2e
        run: ./scripts/Run-E2E.ps1 -Mode RealData -CategoryFilter "${{ inputs.category_filter }}"

      - name: Run real-data UI suite (macOS, mirror over LAN)
        if: matrix.os == 'macOS'
        shell: pwsh
        env:
          ASPNETCORE_ENVIRONMENT: E2E
          SQLEXPRESS_LAN_ADDRESS: ${{ vars.SQLEXPRESS_LAN_ADDRESS || '192.168.1.237,1433' }}
          SQLEXPRESS_PROBE_PASSWORD: ${{ steps.bitwarden-secrets.outputs.QUEENZONE_SQL_EXPRESS_PROBE_PASSWORD }}
          E2E_ADMIN_EMAIL: admin@test.local
          E2E_ARTIFACT_DIR: test-results/e2e
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SQLEXPRESS_PROBE_PASSWORD)) {
            Write-Error "QUEENZONE_SQL_EXPRESS_PROBE_PASSWORD is not configured. Check the Bitwarden secret and BITWARDEN_APP_SERVICE_DEPLOY_SECRETS mapping (see prerequisites above)."
          }
          $env:ConnectionStrings__QueenZoneLegacy = "Server=$env:SQLEXPRESS_LAN_ADDRESS;Database=queenzone_legacy_sync;User Id=queenzone_probe;Password=$env:SQLEXPRESS_PROBE_PASSWORD;TrustServerCertificate=True"
          ./scripts/Run-E2E.ps1 -Mode RealData -CategoryFilter "${{ inputs.category_filter }}"

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-realdata-${{ matrix.os }}-${{ github.run_id }}
          path: |
            test-results/e2e/
            e2e-app.log
            e2e-app.err.log
          if-no-files-found: ignore
          retention-days: 1

  residue-check:
    name: Verify no probe or UI-test residue remains
    # Runs after both the write probes and the UI suite (not as the last step
    # of legacy-write-probes) so it validates UI-test cleanup too, not just
    # probe cleanup.
    needs: [legacy-write-probes, ui-e2e-realdata]
    if: always() && needs.legacy-write-probes.result == 'success'
    runs-on: [self-hosted, Windows]
    timeout-minutes: 15
    env:
      ConnectionStrings__QueenZoneLegacy: "Server=localhost\\SQLEXPRESS;Database=queenzone_legacy_sync;Integrated Security=True;TrustServerCertificate=True"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore
        run: dotnet restore tests/QueenZone.Web.Tests/QueenZone.Web.Tests.csproj

      - name: Verify no probe or leaked web-test residue remains
        env:
          RUN_LEGACY_PROBE_RESIDUE_CHECK: "true"
        run: |
          dotnet test tests/QueenZone.Web.Tests/QueenZone.Web.Tests.csproj `
            --configuration Release `
            --filter "FullyQualifiedName=QueenZone.Web.Tests.EfLegacyProbeResidueTests.Known_probe_and_web_test_markers_are_absent_when_check_enabled"
