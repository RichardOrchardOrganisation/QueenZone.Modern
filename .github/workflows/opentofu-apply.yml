name: OpenTofu apply

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/opentofu-*.yml"
      - "scripts/Test-OpenTofu*.ps1"
      - ".opentofu-version"
  workflow_dispatch:
    inputs:
      root:
        description: Root to plan and apply (use dev while unrelated production drift is unresolved)
        type: choice
        default: all
        options: [all, production, dev]

permissions:
  contents: read

# Concurrency is set per-job below, not per-workflow: the plan job is
# read-only and always safe to preempt, but a shared workflow-level group
# would let a plan run stuck waiting on the apply job's approval gate
# (abandoned, forgotten, or superseded by a later push) block every
# subsequent run indefinitely — confirmed the hard way on 2026-09-03, where
# a stale unapproved run from an earlier merge silently blocked a later
# workflow_dispatch until someone noticed and cancelled it by hand.

# Issue #625, step 8 of epic #615. Structurally separate from
# .github/workflows/deploy.yml (application releases) and from
# opentofu-plan.yml (the PR-time check). The production and dev applies are
# deliberately separate: a dev managed certificate cannot be created until the
# production-root Cloudflare CNAME has been applied and propagated. For an
# automatic/all-root run, the workflow is plan → production apply → CNAME wait
# → dev apply. A deliberate dev-only dispatch remains available for recovery.
#   plan  - opentofu-plan environment (Reader identity; cannot apply).
#           Produces the plan artifact that apply below applies verbatim,
#           and fails closed on any destroy/replace before a human is ever
#           asked to approve anything.
#   apply - opentofu-apply environment. GitHub pauses here for the required
#           reviewer (see docs/architecture/opentofu-state-and-identity.md)
#           before applying the exact plan artifact from the job above —
#           nothing else can run in between (concurrency group + state
#           lease), so "apply only a plan produced from the reviewed commit"
#           holds by construction.
#   post-apply-smoke - the checks from the issue's "Operations" scope that
#           don't exist elsewhere yet (scripts/Test-OpenTofuPostApplySmoke.ps1).
#           A failure here does not roll anything back (OpenTofu has no such
#           mechanism) but fails the workflow loudly, same as deploy.yml's
#           post-deploy-smoke.
jobs:
  plan:
    strategy:
      fail-fast: false
      matrix:
        root: ${{ fromJSON(inputs.root == 'dev' && '["dev"]' || inputs.root == 'production' && '["production"]' || '["production","dev"]') }}
    name: ${{ matrix.root }} plan
    runs-on: ubuntu-latest
    environment: opentofu-plan
    concurrency:
      group: opentofu-apply-plan-${{ matrix.root }}
      # Read-only and produces nothing durable until the apply job's
      # approval gate — always safe to cancel in favour of a newer run,
      # unlike the apply job below.
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read
    env:
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
      ARM_USE_AZUREAD: "true"
      ARM_USE_OIDC: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: Azure login for migration capacity preflight
        if: matrix.root == 'production'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: Check migration target capacity
        if: matrix.root == 'production'
        shell: pwsh
        run: ./scripts/Test-AzureMigrationTargetCapacity.ps1

      - name: Format, safety, init, and validate
        shell: pwsh
        run: ./scripts/Test-OpenTofu.ps1

      - name: Fetch Bitwarden OpenTofu plan secrets
        if: matrix.root == 'production'
        id: bitwarden-secrets
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.BITWARDEN_SECRETS_MANAGER_ACCESS_TOKEN }}
          secrets: ${{ vars.BITWARDEN_OPENTOFU_PLAN_SECRETS }}

      - name: Export ephemeral target SQL administrator password
        if: matrix.root == 'production'
        shell: pwsh
        env:
          SQL_CONNECTION_STRING: ${{ steps.bitwarden-secrets.outputs.QUEENZONE_LEGACY_MIGRATION_CONNECTION_STRING }}
        run: ./scripts/Export-EphemeralSqlAdminPassword.ps1

      - name: Verify Cloudflare plan token is configured
        if: matrix.root == 'production'
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.bitwarden-secrets.outputs.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not configured. Create the CLOUDFLARE_API_TOKEN_TOFU_PLAN Bitwarden secret and map it via the BITWARDEN_OPENTOFU_PLAN_SECRETS repository variable before this workflow can plan Cloudflare resources (see docs/architecture/opentofu-state-and-identity.md)."
            exit 1
          fi

      - name: OpenTofu init
        working-directory: infra/environments/${{ matrix.root }}
        run: tofu init -input=false -reconfigure -backend-config=../../backend/${{ matrix.root }}.backend.hcl

      - name: OpenTofu plan
        working-directory: infra/environments/${{ matrix.root }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.bitwarden-secrets.outputs.CLOUDFLARE_API_TOKEN }}
        run: tofu plan -input=false -out=tfplan

      - name: Render plan as JSON
        working-directory: infra/environments/${{ matrix.root }}
        run: tofu show -json tfplan > plan.json

      - name: Check plan safety and build summary
        shell: pwsh
        run: |
          ./scripts/Test-OpenTofuPlanSafety.ps1 `
            -PlanJsonPath infra/environments/${{ matrix.root }}/plan.json `
            -SummaryPath plan-summary.md

      - name: Write plan summary to the job summary
        if: always()
        shell: bash
        run: |
          if [ -f plan-summary.md ]; then
            cat plan-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # Short retention: this artifact only needs to survive from this job
      # to the apply job's approval gate in the same workflow run, and plan
      # files are treated as sensitive per the contributor runbook even
      # though this stack does not store secrets in HCL/state.
      - name: Upload plan artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opentofu-${{ matrix.root }}-plan-${{ github.run_id }}
          path: infra/environments/${{ matrix.root }}/tfplan
          retention-days: 1

  apply-production:
    name: production apply
    needs: plan
    if: inputs.root != 'dev'
    runs-on: ubuntu-latest
    # GitHub pauses here for the opentofu-apply environment's required
    # reviewer. The reviewer can read the plan job's step summary (posted
    # above) before approving.
    environment: opentofu-apply
    concurrency:
      group: opentofu-apply-production
      # Never cancel an in-flight (or approval-pending) apply — same
      # reasoning as deploy.yml: cancelling mid-apply can leave
      # Azure/Cloudflare state half-updated. The AzureRM backend's blob
      # lease would also block a second concurrent apply anyway; this
      # concurrency group just makes that explicit and queues instead of
      # erroring. Deliberately its own group, separate from the plan job
      # above — see the workflow-level comment for why.
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
      ARM_USE_AZUREAD: "true"
      ARM_USE_OIDC: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: Fetch Bitwarden OpenTofu apply secrets
        id: bitwarden-secrets
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.BITWARDEN_SECRETS_MANAGER_ACCESS_TOKEN }}
          secrets: ${{ vars.BITWARDEN_OPENTOFU_APPLY_SECRETS }}

      - name: Export ephemeral target SQL administrator password
        shell: pwsh
        env:
          SQL_CONNECTION_STRING: ${{ steps.bitwarden-secrets.outputs.QUEENZONE_LEGACY_MIGRATION_CONNECTION_STRING }}
        run: ./scripts/Export-EphemeralSqlAdminPassword.ps1

      - name: Verify Cloudflare apply token is configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.bitwarden-secrets.outputs.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not configured. Create the CLOUDFLARE_API_TOKEN_TOFU_APPLY Bitwarden secret and map it via the BITWARDEN_OPENTOFU_APPLY_SECRETS repository variable before this workflow can apply Cloudflare resources (see docs/architecture/opentofu-state-and-identity.md)."
            exit 1
          fi

      # actions/upload-artifact does NOT preserve the uploader's relative
      # path for a single explicit file — it flattens
      # infra/environments/production/tfplan to just tfplan at the
      # artifact's root (confirmed the hard way: run 33713676359's first
      # real apply failed on "stat tfplan: no such file or directory"
      # because it downloaded to the repo root instead). Download straight
      # into the directory OpenTofu runs from below instead of relying on
      # path preservation.
      - name: Download plan artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opentofu-production-plan-${{ github.run_id }}
          path: infra/environments/production

      - name: OpenTofu init
        working-directory: infra/environments/production
        run: tofu init -input=false -reconfigure -backend-config=../../backend/production.backend.hcl

      # Applies the exact binary plan produced (and safety-checked) by the
      # job above — not a freshly generated plan — so a human never approves
      # one thing and gets another applied.
      - name: OpenTofu apply
        working-directory: infra/environments/production
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.bitwarden-secrets.outputs.CLOUDFLARE_API_TOKEN }}
        run: tofu apply -input=false tfplan

  wait-for-dev-dns:
    name: Wait for dev CNAME propagation
    needs: apply-production
    if: inputs.root != 'dev' && inputs.root != 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Confirm public CNAME target
        shell: bash
        run: |
          set -euo pipefail
          expected="queenzone-devbox.azurewebsites.net"
          for attempt in {1..60}; do
            actual=$(dig +short CNAME dev.queenzone.org @1.1.1.1 | sed 's/\.$//')
            if [ "$actual" = "$expected" ]; then
              echo "dev.queenzone.org resolves to $expected"
              exit 0
            fi
            echo "Attempt $attempt: expected $expected, got ${actual:-no CNAME}."
            sleep 15
          done
          echo "::error::dev.queenzone.org did not resolve to $expected within 15 minutes."
          exit 1

  apply-dev:
    name: dev apply
    needs: [plan, apply-production, wait-for-dev-dns]
    if: >-
      always() && inputs.root != 'production' &&
      (inputs.root == 'dev' ||
      (needs.apply-production.result == 'success' && needs.wait-for-dev-dns.result == 'success'))
    runs-on: ubuntu-latest
    environment: opentofu-apply
    concurrency:
      group: opentofu-apply-dev
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
      ARM_USE_AZUREAD: "true"
      ARM_USE_OIDC: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: Download plan artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opentofu-dev-plan-${{ github.run_id }}
          path: infra/environments/dev

      - name: OpenTofu init
        working-directory: infra/environments/dev
        run: tofu init -input=false -reconfigure -backend-config=../../backend/dev.backend.hcl

      - name: OpenTofu apply
        working-directory: infra/environments/dev
        run: tofu apply -input=false tfplan

  post-apply-smoke:
    name: Post-apply smoke
    if: inputs.root != 'dev'
    needs: apply-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Post-apply checks
        shell: pwsh
        run: ./scripts/Test-OpenTofuPostApplySmoke.ps1

  dev-post-apply-smoke:
    name: Dev custom-domain HTTPS
    if: inputs.root != 'production'
    needs: apply-dev
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify dev custom-domain HTTPS endpoint
        run: curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 10 https://dev.queenzone.org/ --output /dev/null
