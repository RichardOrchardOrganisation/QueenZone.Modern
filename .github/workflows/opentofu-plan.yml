name: OpenTofu plan

# Two different trigger events, deliberately: the opentofu-plan GitHub
# environment's deployment branch policy only trusts *protected* branches
# (see docs/architecture/opentofu-state-and-identity.md), and for a plain
# `pull_request` event, github.ref is the PR's own feature branch — which is
# never protected, so the environment blocks the job outright before any
# step runs (confirmed the hard way on PR #1208's first run). `pull_request_
# target` runs with github.ref set to the base branch (main, protected),
# which satisfies that policy, at the cost of needing an explicit checkout
# of the PR head SHA below instead of the implicit default checkout.
on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/opentofu-*.yml"
      - "scripts/Test-OpenTofu*.ps1"
      - ".opentofu-version"
  pull_request_target:
    paths:
      - "infra/**"
      - ".github/workflows/opentofu-*.yml"
      - "scripts/Test-OpenTofu*.ps1"
      - ".opentofu-version"

permissions:
  contents: read

concurrency:
  # The validation and privileged plan events must not cancel each other.
  group: opentofu-plan-${{ github.event_name }}-${{ github.event.pull_request.number }}
  # Safe to cancel — this workflow is entirely read-only (fmt/validate/plan).
  cancel-in-progress: true

# Issue #625, step 8 of epic #615. Two jobs, each pinned to one of the two
# trigger events above so they don't both fire twice per PR push:
#   fmt-validate - the `pull_request` event only. Runs for every PR,
#     including forks, with no cloud credentials
#     (scripts/Test-OpenTofu.ps1, -backend=false).
#   plan - the `pull_request_target` event only, and only for same-repo PRs
#     (never forks): a real read-only production plan using the
#     opentofu-plan environment/OIDC identity (Reader on Queenzone-RG).
#     Explicitly checks out the PR's head SHA (pull_request_target's
#     default checkout is the base branch, not the PR branch). Fails closed
#     on any proposed delete/replace (scripts/Test-OpenTofuPlanSafety.ps1)
#     and posts a redacted summary as a single, updated PR comment. No plan
#     file is uploaded from this workflow — nothing to leak, and it never
#     needs to.
#
# Apply is a separate workflow (opentofu-apply.yml) gated on the protected
# opentofu-apply environment, entirely independent of this one and of
# .github/workflows/deploy.yml.
jobs:
  fmt-validate:
    name: Format, safety, and local validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: Format, safety, init, and validate
        shell: pwsh
        run: ./scripts/Test-OpenTofu.ps1

      - name: Self-test plan safety checker
        shell: pwsh
        run: ./scripts/Test-OpenTofuPlanSafety.ps1 -SelfTest

  plan:
    strategy:
      fail-fast: false
      matrix:
        root: [production, dev]
    name: ${{ matrix.root }} plan (read-only)
    # Untrusted forks never reach this job: the opentofu-plan GitHub
    # environment only trusts OIDC exchanges from workflow runs on this
    # repository's protected branches (satisfied here via pull_request_target
    # running with github.ref = main), and this same-repo check keeps a fork
    # PR from even attempting the exchange in the first place.
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: opentofu-plan
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    env:
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
      ARM_USE_AZUREAD: "true"
      ARM_USE_OIDC: "true"

    steps:
      # Explicit PR-head checkout: pull_request_target otherwise checks out
      # the base branch (main), which would plan the wrong configuration.
      # This is safe here only because the job above already restricted
      # this job to same-repository PRs — the workflow *definition* still
      # comes from main (pull_request_target's own guarantee), but the HCL
      # this step plans is untrusted-author-controlled the same way any
      # same-repo PR already is.
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: Fetch Bitwarden OpenTofu plan secrets
        if: matrix.root == 'production'
        id: bitwarden-secrets
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.BITWARDEN_SECRETS_MANAGER_ACCESS_TOKEN }}
          secrets: ${{ vars.BITWARDEN_OPENTOFU_PLAN_SECRETS }}

      - name: Export ephemeral target SQL administrator password
        if: matrix.root == 'production'
        shell: pwsh
        env:
          SQL_CONNECTION_STRING: ${{ steps.bitwarden-secrets.outputs.QUEENZONE_LEGACY_MIGRATION_CONNECTION_STRING }}
        run: ./scripts/Export-EphemeralSqlAdminPassword.ps1

      - name: Verify Cloudflare plan token is configured
        if: matrix.root == 'production'
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.bitwarden-secrets.outputs.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not configured. Create the CLOUDFLARE_API_TOKEN_TOFU_PLAN Bitwarden secret and map it via the BITWARDEN_OPENTOFU_PLAN_SECRETS repository variable before this workflow can plan Cloudflare resources (see docs/architecture/opentofu-state-and-identity.md)."
            exit 1
          fi

      - name: OpenTofu init
        working-directory: infra/environments/${{ matrix.root }}
        run: tofu init -input=false -reconfigure -backend-config=../../backend/${{ matrix.root }}.backend.hcl

      - name: OpenTofu plan
        working-directory: infra/environments/${{ matrix.root }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.bitwarden-secrets.outputs.CLOUDFLARE_API_TOKEN }}
        run: tofu plan -input=false -out=tfplan

      - name: Render plan as JSON
        working-directory: infra/environments/${{ matrix.root }}
        run: tofu show -json tfplan > plan.json

      - name: Check plan safety and build summary
        shell: pwsh
        run: |
          ./scripts/Test-OpenTofuPlanSafety.ps1 `
            -PlanJsonPath infra/environments/${{ matrix.root }}/plan.json `
            -SummaryPath plan-summary.md

      - name: Post plan summary to the PR
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const summary = fs.existsSync('plan-summary.md')
              ? fs.readFileSync('plan-summary.md', 'utf8')
              : 'OpenTofu plan did not produce a summary — see the workflow run logs.';
            const marker = '<!-- opentofu-plan-summary-${{ matrix.root }} -->';
            const body = `${marker}\n## ${{ matrix.root }}\n${summary}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
