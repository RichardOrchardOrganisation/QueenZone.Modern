name: PR issue link check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  merge_group:
    types: [checks_requested]
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  check-issue-link:
    runs-on: ubuntu-latest
    steps:
      - name: Pass trivially in the merge queue
        if: github.event_name == 'merge_group'
        run: echo "Issue link already checked on the pull request; passing trivially in the merge queue."

      - name: Checkout
        if: github.event_name != 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check issue link
        if: github.event_name != 'merge_group'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const path = require('node:path');
            const href = pathToFileURL(path.join(process.env.GITHUB_WORKSPACE, 'scripts/check-pr-issue-link.mjs')).href;
            const { checkPullRequestIssueLink } = await import(href);
            await checkPullRequestIssueLink({ github, context, core });
