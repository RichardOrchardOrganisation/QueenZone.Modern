name: PR verification check

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
  workflow_run:
    workflows: [CI, Mobile device smoke]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number whose evidence should be refreshed
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write
  actions: write

concurrency:
  group: ui-proof-refresh-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || inputs.pr }}
  cancel-in-progress: false

jobs:
  refresh-proof:
    runs-on: ubuntu-latest
    steps:
      # Pinned shared code reads only default-branch JSON. No application checkout.
      - name: Link uploaded evidence and refresh required gate
        uses: RichardOrchardOrganisation/development-standards/actions/publish-ui-proof@7452829eef908d89aa6e1515369f1c052e25bc54 # 0.5.1
