name: Publish Android to Google Play

on:
  workflow_dispatch:
    inputs:
      publish_to_play:
        description: Upload the bundle to the selected Google Play testing track
        required: true
        type: boolean
        default: true
      testing_track:
        description: Google Play testing destination
        required: true
        type: choice
        options:
          - internal
          - closed
        default: internal
      app_environment:
        description: API environment to embed in the Google Play build
        required: true
        type: choice
        options:
          - production
          - staging
        default: production

permissions:
  contents: read

concurrency:
  group: publish-android-google-play
  cancel-in-progress: false

jobs:
  preflight:
    name: Mobile preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/QueenZone.Mobile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/QueenZone.Mobile/package-lock.json

      - name: Install
        run: npm ci

      - name: Preflight
        run: npm run preflight

  publish-android:
    name: Sign and upload Android build
    needs: preflight
    if: always() && github.ref == 'refs/heads/main' && needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Play signing / store upload only (issue #1377 Option B). Custom policy:
    # branch main. Distinct from prod-deploy (ARM/OIDC).
    environment: prod-google-play
    defaults:
      run:
        working-directory: src/QueenZone.Mobile
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      EXPO_PUBLIC_APP_ENV: ${{ inputs.app_environment }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      EXPO_PUBLIC_TELEMETRYDECK_APP_ID: ${{ vars.TELEMETRYDECK_APP_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Record build metadata
        run: |
          echo "BUILD_TIMESTAMP_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "BUILD_REVISION=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/QueenZone.Mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: npm ci

      - name: Generate Android project
        env:
          # Expo writes `version` / versionName at prebuild. Pass the run
          # number here so Home and Play share `{prefix}.{run}` (#1078).
          # android.versionCode must also be baked here: Expo defaults to 1
          # and -Pandroid.injected.version.code did not win (#1195).
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: npx expo prebuild --platform android --clean --no-install

      - name: Confirm Sentry DSN is baked into Expo extra
        run: |
          set -euo pipefail
          dsn=$(npx expo config --json | jq -r '.extra.sentryDsn // .exp.extra.sentryDsn // empty')
          if [ -z "$dsn" ]; then
            echo "::error::app.config extra.sentryDsn is empty; published builds will not report to Sentry."
            exit 1
          fi
          echo "extra.sentryDsn is set (length ${#dsn})"

      - name: Confirm TelemetryDeck App ID is baked into Expo extra
        run: |
          set -euo pipefail
          app_id=$(npx expo config --json | jq -r '.extra.telemetryDeckAppId // .exp.extra.telemetryDeckAppId // empty')
          if [ -z "$app_id" ]; then
            echo "::error::app.config extra.telemetryDeckAppId is empty; product analytics will be disabled."
            exit 1
          fi
          echo "extra.telemetryDeckAppId is set (length ${#app_id})"

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-play-${{ runner.os }}-${{ hashFiles('src/QueenZone.Mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-play-${{ runner.os }}-
            gradle-${{ runner.os }}-

      - name: Fetch Android publishing secrets from Bitwarden
        id: bitwarden-secrets
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.BITWARDEN_SECRETS_MANAGER_ACCESS_TOKEN }}
          secrets: ${{ vars.BITWARDEN_MOBILE_BUILD_SECRETS }}

      - name: Check publishing credentials
        env:
          ANDROID_TEST_KEYSTORE_BASE64: ${{ steps.bitwarden-secrets.outputs.ANDROID_TEST_KEYSTORE_BASE64 }}
          ANDROID_TEST_KEYSTORE_PASSWORD: ${{ steps.bitwarden-secrets.outputs.ANDROID_TEST_KEYSTORE_PASSWORD }}
          ANDROID_TEST_KEY_PASSWORD: ${{ steps.bitwarden-secrets.outputs.ANDROID_TEST_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ steps.bitwarden-secrets.outputs.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          SENTRY_AUTH_TOKEN: ${{ steps.bitwarden-secrets.outputs.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          PUBLISH_TO_PLAY: ${{ inputs.publish_to_play }}
        run: |
          missing=0
          for name in \
            ANDROID_TEST_KEYSTORE_BASE64 \
            ANDROID_TEST_KEYSTORE_PASSWORD \
            ANDROID_TEST_KEY_PASSWORD \
            EXPO_PUBLIC_SENTRY_DSN \
            EXPO_PUBLIC_TELEMETRYDECK_APP_ID \
            SENTRY_AUTH_TOKEN \
            SENTRY_ORG \
            SENTRY_PROJECT; do
            eval "value=\${$name-}"
            if [ -z "$value" ]; then
              echo "::error::$name is not configured for the prod-google-play environment."
              missing=1
            else
              echo "$name is set (length ${#value})"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          if [ "$PUBLISH_TO_PLAY" = "true" ]; then
            if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
              echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not configured for the prod-google-play environment."
              exit 1
            fi
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is set (length ${#GOOGLE_PLAY_SERVICE_ACCOUNT_JSON})"
            printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" | jq -e \
              '.type == "service_account" and (.client_email | length > 0) and (.private_key | length > 0)' \
              >/dev/null
          fi

      - name: Restore upload key
        env:
          ANDROID_TEST_KEYSTORE_BASE64: ${{ steps.bitwarden-secrets.outputs.ANDROID_TEST_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/queenzone-signing"
          printf '%s' "$ANDROID_TEST_KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/queenzone-signing/queenzone-upload.jks"

      - name: Build signed Android App Bundle
        working-directory: src/QueenZone.Mobile/android
        env:
          EXPO_PUBLIC_APP_ENV: ${{ inputs.app_environment }}
          # This step (not "Generate Android project") is what runs the JS
          # bundling Gradle task, so EXPO_PUBLIC_SENTRY_DSN must be set here
          # too or it inlines as undefined and Sentry.init() silently no-ops.
          EXPO_PUBLIC_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          ANDROID_TEST_KEYSTORE_PASSWORD: ${{ steps.bitwarden-secrets.outputs.ANDROID_TEST_KEYSTORE_PASSWORD }}
          ANDROID_TEST_KEY_PASSWORD: ${{ steps.bitwarden-secrets.outputs.ANDROID_TEST_KEY_PASSWORD }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ steps.bitwarden-secrets.outputs.SENTRY_AUTH_TOKEN }}
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.version.code="$ANDROID_VERSION_CODE" \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/queenzone-signing/queenzone-upload.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_TEST_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias=queenzone-test \
            -Pandroid.injected.signing.key.password="$ANDROID_TEST_KEY_PASSWORD"

      - name: Verify Android App Bundle
        run: |
          set -euo pipefail
          bundle=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$bundle"
          # No -strict: Android signing certs are self-signed by design (no CA
          # chain), which jarsigner -strict treats as a hard failure (exit 4)
          # even though the signature itself is valid.
          jarsigner -verify "$bundle"

          # Play rejects reused versionCode. jarsigner does not dump it — same
          # class of miss as IPA CFBundleVersion=1 before the TestFlight assert.
          expected_code="${ANDROID_VERSION_CODE}"
          bundletool_jar="$RUNNER_TEMP/bundletool.jar"
          curl --fail --silent --show-error --location \
            "https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar" \
            --output "$bundletool_jar"
          version_code=$(java -jar "$bundletool_jar" dump manifest \
            --bundle="$bundle" \
            --xpath=/manifest/@android:versionCode)
          echo "AAB versionCode=${version_code} (expected ${expected_code})"
          if [ "$version_code" != "$expected_code" ]; then
            echo "::error::AAB versionCode is ${version_code}, expected ${expected_code}."
            echo "Play Console rejects reused versionCode values."
            echo "Ensure app.config.ts maps GITHUB_RUN_NUMBER to android.versionCode before prebuild."
            exit 1
          fi

          constants_config="$RUNNER_TEMP/queenzone-aab-app.config"
          unzip -p "$bundle" base/assets/app.config > "$constants_config"
          expected_api_base_url=$(node -e "const { resolveApiBaseUrl } = require('./apiEnvironments.cjs'); process.stdout.write(resolveApiBaseUrl({ appEnv: process.env.EXPO_PUBLIC_APP_ENV }));")
          baked_app_environment=$(jq -r '.extra.appEnv // .exp.extra.appEnv // empty' "$constants_config")
          baked_api_base_url=$(jq -r '.extra.apiBaseUrl // .exp.extra.apiBaseUrl // empty' "$constants_config")
          echo "AAB API target=${baked_app_environment} (${baked_api_base_url})"
          if [ "$baked_app_environment" != "$EXPO_PUBLIC_APP_ENV" ]; then
            echo "::error::AAB app environment is ${baked_app_environment:-<missing>}, expected ${EXPO_PUBLIC_APP_ENV}."
            exit 1
          fi
          if [ "$baked_api_base_url" != "$expected_api_base_url" ]; then
            echo "::error::AAB API base URL is ${baked_api_base_url:-<missing>}, expected ${expected_api_base_url}."
            exit 1
          fi
          if [ -z "${EXPO_PUBLIC_TELEMETRYDECK_APP_ID:-}" ]; then
            echo "::error::EXPO_PUBLIC_TELEMETRYDECK_APP_ID is not set; product analytics will be disabled."
            exit 1
          fi
          if ! grep -Fq "$EXPO_PUBLIC_TELEMETRYDECK_APP_ID" "$constants_config"; then
            echo "::error::AAB is missing extra.telemetryDeckAppId; product analytics will be disabled."
            exit 1
          fi

      - name: Upload bundle artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: queen-zone-android-play-${{ github.run_number }}
          path: src/QueenZone.Mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
          if-no-files-found: error

      - name: Upload to Google Play ${{ inputs.testing_track }} testing
        if: inputs.publish_to_play
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ steps.bitwarden-secrets.outputs.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.queenzone.mobile
          releaseFiles: src/QueenZone.Mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.testing_track == 'closed' && 'alpha' || 'internal' }}
          status: completed
