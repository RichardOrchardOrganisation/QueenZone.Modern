name: Publish iOS to TestFlight

on:
  workflow_dispatch:
    inputs:
      app_environment:
        description: API environment to embed in the TestFlight build
        required: true
        type: choice
        options:
          - production
          - staging
        default: production

permissions:
  contents: read

concurrency:
  group: publish-ios-testflight
  cancel-in-progress: false

jobs:
  preflight:
    name: Mobile preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/QueenZone.Mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/QueenZone.Mobile/package-lock.json

      - name: Install
        run: npm ci

      - name: Preflight
        run: npm run preflight

  publish-ios:
    name: Sign and upload iOS build
    needs: preflight
    if: always() && github.ref == 'refs/heads/main' && needs.preflight.result == 'success'
    runs-on: [self-hosted, macOS, ARM64, ios-signing]
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src/QueenZone.Mobile
    env:
      APP_BUNDLE_ID: org.queenzone.mobile
      SHARE_EXTENSION_BUNDLE_ID: org.queenzone.mobile.ShareExtension
      WIDGET_EXTENSION_BUNDLE_ID: org.queenzone.mobile.ExpoWidgetsTarget
      APP_GROUP_ID: group.org.queenzone.mobile
      IOS_BUILD_NUMBER: ${{ github.run_number }}
      APPLE_TEAM_ID: X28Z75P69M
      APP_PROVISIONING_PROFILE_NAME: QueenZone App Store App Groups
      SHARE_EXTENSION_PROVISIONING_PROFILE_NAME: QueenZone Share Extension App Store
      WIDGET_EXTENSION_PROVISIONING_PROFILE_NAME: QueenZone Widget Extension App Store
      # App Store / TestFlight profiles only include aps-environment=production.
      # Expo prebuild emits development; Xcode replaces it during the signed archive.
      IOS_APS_ENVIRONMENT: production
      EXPO_PUBLIC_APP_ENV: ${{ inputs.app_environment }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      EXPO_PUBLIC_TELEMETRYDECK_APP_ID: ${{ vars.TELEMETRYDECK_APP_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Record build metadata
        run: |
          set -euo pipefail
          echo "BUILD_TIMESTAMP_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "BUILD_REVISION=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/QueenZone.Mobile/package-lock.json

      - name: Check signing secrets
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APP_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          SHARE_EXTENSION_PROFILE_BASE64: ${{ secrets.IOS_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
          WIDGET_EXTENSION_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          for value in \
            "$CERTIFICATE_BASE64" \
            "$CERTIFICATE_PASSWORD" \
            "$APP_PROFILE_BASE64" \
            "$SHARE_EXTENSION_PROFILE_BASE64" \
            "$WIDGET_EXTENSION_PROFILE_BASE64" \
            "$API_KEY_ID" \
            "$API_ISSUER_ID" \
            "$API_PRIVATE_KEY"; do
            if [ -z "$value" ]; then
              echo "::error::One or more iOS signing secrets are not configured."
              exit 1
            fi
          done

      # Sentry upload runs in the Xcode archive phase. Missing org/project/token
      # fails the archive with "organization ID or slug is required" (see #857).
      # Fail fast here — lengths only, never print secret values.
      - name: Check Sentry config
        env:
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          for name in SENTRY_DSN EXPO_PUBLIC_SENTRY_DSN EXPO_PUBLIC_TELEMETRYDECK_APP_ID SENTRY_ORG SENTRY_PROJECT SENTRY_AUTH_TOKEN; do
            eval "value=\${$name-}"
            if [ -z "$value" ]; then
              echo "::error::$name is not set (Settings → Secrets and variables → Actions)."
              missing=1
            else
              echo "$name is set (length ${#value})"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          if [ "$SENTRY_ORG" != "self-0tb" ] || [ "$SENTRY_PROJECT" != "queenzone-mobile" ]; then
            echo "::warning::Unexpected Sentry target org='$SENTRY_ORG' project='$SENTRY_PROJECT' (expected self-0tb / queenzone-mobile)."
          fi

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Ensure CocoaPods CLI
        run: |
          set -euo pipefail
          # The GitHub Actions runner service does not load ~/.zprofile, so
          # Homebrew (and a brew-installed `pod`) are often missing from PATH
          # even when they work in an interactive shell on this Mac.
          for brew_prefix in /opt/homebrew /usr/local; do
            if [ -x "$brew_prefix/bin/brew" ]; then
              echo "$brew_prefix/bin" >> "$GITHUB_PATH"
              eval "$("$brew_prefix/bin/brew" shellenv)"
              break
            fi
          done

          if ! command -v pod >/dev/null 2>&1; then
            if command -v brew >/dev/null 2>&1; then
              brew list cocoapods >/dev/null 2>&1 || brew install cocoapods
            else
              gem_bin="$(ruby -e 'puts Gem.user_dir')/bin"
              echo "$gem_bin" >> "$GITHUB_PATH"
              export PATH="$gem_bin:$PATH"
              gem install cocoapods --user-install --no-document
            fi
          fi

          if ! command -v pod >/dev/null 2>&1; then
            echo "::error::CocoaPods CLI is not available on this runner after Homebrew/gem install."
            echo "Install CocoaPods on the ios-signing Mac (brew install cocoapods) and add /opt/homebrew/bin to the runner service PATH."
            exit 1
          fi

          echo "Using $(command -v pod) ($(pod --version))"

      - name: Generate iOS project
        env:
          # Expo writes ios.buildNumber literally into Info.plist at prebuild.
          # xcodebuild CURRENT_PROJECT_VERSION alone cannot override that literal,
          # so App Store Connect rejected re-uploads with CFBundleVersion=1.
          IOS_BUILD_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          set -euo pipefail
          echo "Using iOS build number ${IOS_BUILD_NUMBER}"
          npx expo prebuild --platform ios --clean --no-install
          info_plist=$(find ios -path '*/Info.plist' -not -path '*/Pods/*' -print -quit)
          if [ -z "$info_plist" ]; then
            echo "::error::prebuild did not produce an app Info.plist."
            exit 1
          fi
          bundle_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$info_plist")
          echo "Info.plist CFBundleVersion=${bundle_version} (from ${info_plist})"
          if [ "$bundle_version" != "$IOS_BUILD_NUMBER" ]; then
            echo "::error::CFBundleVersion is ${bundle_version}, expected ${IOS_BUILD_NUMBER}."
            echo "Ensure app.config.ts maps IOS_BUILD_NUMBER to ios.buildNumber before prebuild."
            exit 1
          fi
          encryption=$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$info_plist")
          echo "Info.plist ITSAppUsesNonExemptEncryption=${encryption}"
          if [ "$encryption" != "false" ]; then
            echo "::error::ITSAppUsesNonExemptEncryption must be false."
            exit 1
          fi
          scene_delegate=$(/usr/libexec/PlistBuddy \
            -c 'Print :UIApplicationSceneManifest:UISceneConfigurations:UIWindowSceneSessionRoleApplication:0:UISceneDelegateClassName' \
            "$info_plist" 2>/dev/null || true)
          if [ "$scene_delegate" != '$(PRODUCT_MODULE_NAME).SceneDelegate' ]; then
            echo "::error::The generated app does not declare the required iOS scene delegate."
            exit 1
          fi
          app_delegate=$(find ios -path '*/AppDelegate.swift' -not -path '*/Pods/*' -print -quit)
          if [ -z "$app_delegate" ] \
            || ! grep -Fq 'class SceneDelegate: UIResponder, UIWindowSceneDelegate' "$app_delegate" \
            || ! grep -Fq 'configurationForConnecting connectingSceneSession' "$app_delegate"; then
            echo "::error::The generated AppDelegate is missing the QueenZone iOS scene lifecycle."
            exit 1
          fi
          echo "iOS scene lifecycle is present (delegate ${scene_delegate})."
          # expo-share-intent also generates ShareExtension.entitlements, but
          # that extension must not carry the main app's push entitlement.
          # Resolve the entitlements beside the already-identified app
          # Info.plist instead of accepting whichever file find returns first.
          app_ios_dir=$(dirname "$info_plist")
          entitlements=$(find "$app_ios_dir" -maxdepth 1 -name '*.entitlements' -print -quit)
          if [ -z "$entitlements" ]; then
            echo "::error::prebuild did not produce an entitlements file."
            exit 1
          fi
          aps_environment=$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' "$entitlements")
          echo "Entitlements aps-environment=${aps_environment} (from ${entitlements})"
          if [ "$aps_environment" != "development" ]; then
            echo "::error::Prebuild aps-environment is ${aps_environment}, expected development."
            echo "Expo SDK 57 emits development at prebuild; Xcode changes it to production during the App Store archive."
            exit 1
          fi

      - name: Confirm Sentry DSN is baked into Expo extra
        run: |
          set -euo pipefail
          dsn=$(npx expo config --json | jq -r '.extra.sentryDsn // .exp.extra.sentryDsn // empty')
          if [ -z "$dsn" ]; then
            echo "::error::app.config extra.sentryDsn is empty; published builds will not report to Sentry."
            exit 1
          fi
          echo "extra.sentryDsn is set (length ${#dsn})"

      - name: Confirm TelemetryDeck App ID is baked into Expo extra
        run: |
          set -euo pipefail
          app_id=$(npx expo config --json | jq -r '.extra.telemetryDeckAppId // .exp.extra.telemetryDeckAppId // empty')
          if [ -z "$app_id" ]; then
            echo "::error::app.config extra.telemetryDeckAppId is empty; product analytics will be disabled."
            exit 1
          fi
          echo "extra.telemetryDeckAppId is set (length ${#app_id})"

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            src/QueenZone.Mobile/ios/Pods
          key: pods-testflight-${{ runner.os }}-${{ hashFiles('src/QueenZone.Mobile/ios/Podfile', 'src/QueenZone.Mobile/package-lock.json') }}
          restore-keys: |
            pods-testflight-${{ runner.os }}-

      - name: Install CocoaPods dependencies
        working-directory: src/QueenZone.Mobile/ios
        run: |
          set -euo pipefail
          export LANG=en_US.UTF-8
          export LC_ALL=en_US.UTF-8
          pod install
          workspace=$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)
          if [ -z "$workspace" ]; then
            echo "::error::pod install did not produce an .xcworkspace."
            ls -la
            exit 1
          fi
          echo "Using workspace $workspace"

      - name: Install signing identity and provisioning profile
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APP_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          SHARE_EXTENSION_PROFILE_BASE64: ${{ secrets.IOS_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
          WIDGET_EXTENSION_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          signing_dir="$RUNNER_TEMP/queenzone-ios-signing"
          keychain_path="$signing_dir/queenzone-ci.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          certificate_path="$signing_dir/distribution.p12"
          app_profile_path="$signing_dir/app.mobileprovision"
          share_extension_profile_path="$signing_dir/share-extension.mobileprovision"
          widget_extension_profile_path="$signing_dir/widget-extension.mobileprovision"

          mkdir -p "$signing_dir"
          printf '%s' "$CERTIFICATE_BASE64" | /usr/bin/base64 -D > "$certificate_path"
          printf '%s' "$APP_PROFILE_BASE64" | /usr/bin/base64 -D > "$app_profile_path"
          printf '%s' "$SHARE_EXTENSION_PROFILE_BASE64" | /usr/bin/base64 -D > "$share_extension_profile_path"
          printf '%s' "$WIDGET_EXTENSION_PROFILE_BASE64" | /usr/bin/base64 -D > "$widget_extension_profile_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          curl --fail --silent --show-error --location \
            https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer \
            --output "$signing_dir/AppleWWDRCAG3.cer"
          security import "$signing_dir/AppleWWDRCAG3.cer" \
            -k "$keychain_path" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path" >/dev/null
          security list-keychains -d user -s \
            "$keychain_path" \
            "$HOME/Library/Keychains/login.keychain-db"

          profiles_dir="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profiles_dir"

          install_profile() {
            profile_path=$1
            expected_name=$2
            expected_bundle_id=$3
            require_push=$4
            profile_plist="$signing_dir/$(basename "$profile_path" .mobileprovision).plist"

            openssl smime -inform der -verify -noverify \
              -in "$profile_path" \
              -out "$profile_plist" 2>/dev/null
            profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")
            profile_name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")
            application_id=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")

            if [ "$profile_name" != "$expected_name" ]; then
              echo "::error::Unexpected provisioning profile name: $profile_name (expected $expected_name)."
              exit 1
            fi
            if [ "$application_id" != "$APPLE_TEAM_ID.$expected_bundle_id" ]; then
              echo "::error::Provisioning profile \"$profile_name\" does not match $expected_bundle_id."
              exit 1
            fi

            if ! /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups' "$profile_plist" 2>/dev/null \
              | grep -Fq "$APP_GROUP_ID"; then
              echo "::error::Provisioning profile \"$profile_name\" does not include App Group $APP_GROUP_ID."
              echo "Assign the App Group to App ID $expected_bundle_id, regenerate the profile, and update its GitHub Actions secret."
              exit 1
            fi

            aps_environment=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$profile_plist" 2>/dev/null || true)
            if [ "$require_push" = true ]; then
              echo "Provisioning profile \"$profile_name\" aps-environment=${aps_environment:-<missing>}"
              if [ "$aps_environment" != "$IOS_APS_ENVIRONMENT" ]; then
                echo "::error::Provisioning profile \"$profile_name\" aps-environment is ${aps_environment:-<missing>}, expected ${IOS_APS_ENVIRONMENT}."
                exit 1
              fi
              if ! /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.applesignin' "$profile_plist" 2>/dev/null \
                | grep -Fq 'Default'; then
                echo "::error::Provisioning profile \"$profile_name\" does not include Sign in with Apple."
                echo "Enable Sign in with Apple on App ID $expected_bundle_id, regenerate the profile, and update its GitHub Actions secret."
                exit 1
              fi
            elif [ -n "$aps_environment" ]; then
              echo "::error::Extension profile \"$profile_name\" unexpectedly includes aps-environment."
              exit 1
            fi

            cp "$profile_path" "$profiles_dir/$profile_uuid.mobileprovision"
          }

          install_profile \
            "$app_profile_path" \
            "$APP_PROVISIONING_PROFILE_NAME" \
            "$APP_BUNDLE_ID" \
            true
          install_profile \
            "$share_extension_profile_path" \
            "$SHARE_EXTENSION_PROVISIONING_PROFILE_NAME" \
            "$SHARE_EXTENSION_BUNDLE_ID" \
            false
          install_profile \
            "$widget_extension_profile_path" \
            "$WIDGET_EXTENSION_PROVISIONING_PROFILE_NAME" \
            "$WIDGET_EXTENSION_BUNDLE_ID" \
            false

          echo "IOS_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$keychain_path"

      - name: Configure target-specific code signing
        working-directory: src/QueenZone.Mobile/ios
        run: |
          set -euo pipefail
          ruby_command=$(command -v ruby)
          if command -v brew >/dev/null 2>&1 && brew list cocoapods >/dev/null 2>&1; then
            cocoapods_prefix=$(brew --prefix cocoapods)
            ruby_command=$(head -1 "$cocoapods_prefix/libexec/bin/pod" | sed 's/^#!//')
            export GEM_HOME="$cocoapods_prefix/libexec"
          fi

          "$ruby_command" <<'RUBY'
          require 'xcodeproj'

          project_path = Dir['*.xcodeproj'].first or abort('No Xcode project found.')
          project = Xcodeproj::Project.open(project_path)
          targets = {
            'QueenZone' => {
              bundle_id: ENV.fetch('APP_BUNDLE_ID'),
              profile_name: ENV.fetch('APP_PROVISIONING_PROFILE_NAME')
            },
            'ShareExtension' => {
              bundle_id: ENV.fetch('SHARE_EXTENSION_BUNDLE_ID'),
              profile_name: ENV.fetch('SHARE_EXTENSION_PROVISIONING_PROFILE_NAME')
            },
            'ExpoWidgetsTarget' => {
              bundle_id: ENV.fetch('WIDGET_EXTENSION_BUNDLE_ID'),
              profile_name: ENV.fetch('WIDGET_EXTENSION_PROVISIONING_PROFILE_NAME')
            }
          }

          targets.each do |target_name, signing|
            target = project.targets.find { |candidate| candidate.name == target_name }
            abort("Target #{target_name} was not generated.") unless target

            target.build_configurations.each do |configuration|
              configuration.build_settings['CODE_SIGN_STYLE'] = 'Manual'
              configuration.build_settings['DEVELOPMENT_TEAM'] = ENV.fetch('APPLE_TEAM_ID')
              configuration.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = signing.fetch(:bundle_id)
              configuration.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = signing.fetch(:profile_name)
            end
          end

          project.save
          RUBY

      - name: Archive signed iOS app
        working-directory: src/QueenZone.Mobile/ios
        env:
          EXPO_PUBLIC_APP_ENV: ${{ inputs.app_environment }}
          # The "Bundle React Native code and images" Xcode build phase runs
          # inside this step, not the earlier "Generate iOS project" step, so
          # EXPO_PUBLIC_SENTRY_DSN must be set here too or it inlines as
          # undefined and Sentry.init() silently no-ops in the shipped bundle.
          EXPO_PUBLIC_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          # Also set org/project here (not only at prebuild) so sentry-cli does
          # not depend solely on the generated sentry.properties file.
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          workspace=$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)
          if [ -z "$workspace" ]; then
            echo "::error::No .xcworkspace found in ios/. CocoaPods install is required before archiving."
            ls -la
            exit 1
          fi
          scheme=$(basename "$workspace" .xcworkspace)
          archive_path="$RUNNER_TEMP/QueenZone.xcarchive"

          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            OTHER_CODE_SIGN_FLAGS="--keychain $IOS_KEYCHAIN_PATH" \
            archive

          test -d "$archive_path"

      - name: Export signed IPA
        run: |
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          export_path="$RUNNER_TEMP/queenzone-ios-export"
          cat > "$export_options" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>method</key>
            <string>app-store-connect</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$APP_BUNDLE_ID</key>
              <string>$APP_PROVISIONING_PROFILE_NAME</string>
              <key>$SHARE_EXTENSION_BUNDLE_ID</key>
              <string>$SHARE_EXTENSION_PROVISIONING_PROFILE_NAME</string>
              <key>$WIDGET_EXTENSION_BUNDLE_ID</key>
              <string>$WIDGET_EXTENSION_PROVISIONING_PROFILE_NAME</string>
            </dict>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/QueenZone.xcarchive" \
            -exportPath "$export_path" \
            -exportOptionsPlist "$export_options"

          ipa_path=$(find "$export_path" -maxdepth 1 -name '*.ipa' -print -quit)
          if [ -z "$ipa_path" ]; then
            echo "::error::The signed IPA was not produced."
            exit 1
          fi
          echo "IOS_IPA_PATH=$ipa_path" >> "$GITHUB_ENV"

      - name: Verify IPA signature and provisioning profile
        run: |
          verify_dir="$RUNNER_TEMP/queenzone-ios-verify"
          mkdir -p "$verify_dir"
          ditto -x -k "$IOS_IPA_PATH" "$verify_dir"
          app_path=$(find "$verify_dir/Payload" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          find_extension_by_bundle_id() {
            expected_bundle_id=$1
            for extension_path in "$app_path"/PlugIns/*.appex; do
              [ -d "$extension_path" ] || continue
              extension_bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$extension_path/Info.plist")
              if [ "$extension_bundle_id" = "$expected_bundle_id" ]; then
                printf '%s\n' "$extension_path"
                return 0
              fi
            done
            return 1
          }

          share_extension_path=$(find_extension_by_bundle_id "$SHARE_EXTENSION_BUNDLE_ID")
          widget_extension_path=$(find_extension_by_bundle_id "$WIDGET_EXTENSION_BUNDLE_ID")
          codesign --verify --strict --verbose=2 "$share_extension_path"
          codesign --verify --strict --verbose=2 "$widget_extension_path"

          verify_embedded_profile() {
            bundle_path=$1
            expected_bundle_id=$2
            require_push=$3
            label=$4
            profile_plist="$verify_dir/$label-profile.plist"

            openssl smime -inform der -verify -noverify \
              -in "$bundle_path/embedded.mobileprovision" \
              -out "$profile_plist" 2>/dev/null
            application_id=$(/usr/libexec/PlistBuddy \
              -c 'Print :Entitlements:application-identifier' \
              "$profile_plist")
            if [ "$application_id" != "$APPLE_TEAM_ID.$expected_bundle_id" ]; then
              echo "::error::$label has application identifier $application_id, expected $APPLE_TEAM_ID.$expected_bundle_id."
              exit 1
            fi
            if ! /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups' "$profile_plist" 2>/dev/null \
              | grep -Fq "$APP_GROUP_ID"; then
              echo "::error::$label does not include App Group $APP_GROUP_ID."
              exit 1
            fi

            ipa_aps_environment=$(/usr/libexec/PlistBuddy \
              -c 'Print :Entitlements:aps-environment' \
              "$profile_plist" 2>/dev/null || true)
            if [ "$require_push" = true ] && [ "$ipa_aps_environment" != "$IOS_APS_ENVIRONMENT" ]; then
              echo "::error::$label aps-environment is ${ipa_aps_environment:-<missing>}, expected ${IOS_APS_ENVIRONMENT}."
              exit 1
            fi
            if [ "$require_push" = true ] \
              && ! /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.applesignin' "$profile_plist" 2>/dev/null \
                | grep -Fq 'Default'; then
              echo "::error::$label embedded profile does not include Sign in with Apple."
              exit 1
            fi
            if [ "$require_push" = false ] && [ -n "$ipa_aps_environment" ]; then
              echo "::error::$label unexpectedly includes aps-environment."
              exit 1
            fi
          }

          verify_embedded_profile "$app_path" "$APP_BUNDLE_ID" true app
          verify_embedded_profile "$share_extension_path" "$SHARE_EXTENSION_BUNDLE_ID" false share-extension
          verify_embedded_profile "$widget_extension_path" "$WIDGET_EXTENSION_BUNDLE_ID" false widget-extension

          expected_build="${IOS_BUILD_NUMBER}"
          bundle_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_path/Info.plist")
          echo "IPA CFBundleVersion=${bundle_version} (expected ${expected_build})"
          if [ "$bundle_version" != "$expected_build" ]; then
            echo "::error::IPA CFBundleVersion is ${bundle_version}, expected ${expected_build}."
            echo "App Store Connect rejects duplicate/non-increasing CFBundleVersion values."
            exit 1
          fi

          expected_short=$(node -e "const { marketingVersionPrefix, resolveMarketingVersion } = require('./apiEnvironments.cjs'); process.stdout.write(resolveMarketingVersion({ prefix: marketingVersionPrefix, runNumber: process.env.GITHUB_RUN_NUMBER || process.env.IOS_BUILD_NUMBER }));")
          short_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Info.plist")
          echo "IPA CFBundleShortVersionString=${short_version} (expected ${expected_short})"
          if [ "$short_version" != "$expected_short" ]; then
            echo "::error::IPA CFBundleShortVersionString is ${short_version}, expected ${expected_short}."
            exit 1
          fi

          encryption=$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$app_path/Info.plist")
          echo "IPA ITSAppUsesNonExemptEncryption=${encryption}"
          if [ "$encryption" != "false" ]; then
            echo "::error::Exported IPA is missing the exempt-encryption declaration."
            exit 1
          fi

          scene_delegate=$(/usr/libexec/PlistBuddy \
            -c 'Print :UIApplicationSceneManifest:UISceneConfigurations:UIWindowSceneSessionRoleApplication:0:UISceneDelegateClassName' \
            "$app_path/Info.plist" 2>/dev/null || true)
          app_module=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Info.plist")
          expected_scene_delegate="${app_module}.SceneDelegate"
          if [ "$scene_delegate" != "$expected_scene_delegate" ]; then
            echo "::error::Exported IPA scene delegate is ${scene_delegate:-<missing>}, expected ${expected_scene_delegate}."
            exit 1
          fi
          echo "IPA scene delegate=${scene_delegate}"

          constants_config="$app_path/EXConstants.bundle/app.config"
          expected_api_base_url=$(node -e "const { resolveApiBaseUrl } = require('./apiEnvironments.cjs'); process.stdout.write(resolveApiBaseUrl({ appEnv: process.env.EXPO_PUBLIC_APP_ENV }));")
          baked_app_environment=$(jq -r '.extra.appEnv // .exp.extra.appEnv // empty' "$constants_config")
          baked_api_base_url=$(jq -r '.extra.apiBaseUrl // .exp.extra.apiBaseUrl // empty' "$constants_config")
          echo "IPA API target=${baked_app_environment} (${baked_api_base_url})"
          if [ "$baked_app_environment" != "$EXPO_PUBLIC_APP_ENV" ]; then
            echo "::error::Exported IPA app environment is ${baked_app_environment:-<missing>}, expected ${EXPO_PUBLIC_APP_ENV}."
            exit 1
          fi
          if [ "$baked_api_base_url" != "$expected_api_base_url" ]; then
            echo "::error::Exported IPA API base URL is ${baked_api_base_url:-<missing>}, expected ${expected_api_base_url}."
            exit 1
          fi
          if ! grep -Fq "$BUILD_TIMESTAMP_UTC" "$constants_config"; then
            echo "::error::Exported IPA is missing build timestamp ${BUILD_TIMESTAMP_UTC}."
            exit 1
          fi
          if [ -z "${EXPO_PUBLIC_SENTRY_DSN:-}" ]; then
            echo "::error::EXPO_PUBLIC_SENTRY_DSN is not set; cannot verify Sentry extra in the IPA."
            exit 1
          fi
          if ! grep -Fq "$EXPO_PUBLIC_SENTRY_DSN" "$constants_config"; then
            echo "::error::Exported IPA is missing extra.sentryDsn; Sentry will not initialize."
            exit 1
          fi
          if [ -z "${EXPO_PUBLIC_TELEMETRYDECK_APP_ID:-}" ]; then
            echo "::error::EXPO_PUBLIC_TELEMETRYDECK_APP_ID is not set; product analytics will be disabled."
            exit 1
          fi
          if ! grep -Fq "$EXPO_PUBLIC_TELEMETRYDECK_APP_ID" "$constants_config"; then
            echo "::error::Exported IPA is missing extra.telemetryDeckAppId; product analytics will be disabled."
            exit 1
          fi
          if ! grep -Fq "$BUILD_REVISION" "$constants_config"; then
            echo "::error::Exported IPA is missing build revision ${BUILD_REVISION}."
            exit 1
          fi

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: queen-zone-ios-${{ github.run_number }}
          path: ${{ env.IOS_IPA_PATH }}
          retention-days: 7
          if-no-files-found: error

      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          api_keys_dir="$RUNNER_TEMP/app-store-connect-private-keys"
          mkdir -p "$api_keys_dir"
          printf '%s' "$API_PRIVATE_KEY" > "$api_keys_dir/AuthKey_$API_KEY_ID.p8"
          chmod 600 "$api_keys_dir/AuthKey_$API_KEY_ID.p8"
          export API_PRIVATE_KEYS_DIR="$api_keys_dir"

          xcrun altool \
            --upload-app \
            -f "$IOS_IPA_PATH" \
            --api-key "$API_KEY_ID" \
            --api-issuer "$API_ISSUER_ID" \
            --show-progress

      - name: Remove signing material
        if: always()
        run: |
          keychain_path="${IOS_KEYCHAIN_PATH:-$RUNNER_TEMP/queenzone-ios-signing/queenzone-ci.keychain-db}"
          security list-keychains -d user -s \
            "$HOME/Library/Keychains/login.keychain-db" 2>/dev/null || true
          security delete-keychain "$keychain_path" 2>/dev/null || true
          if [ -n "${IOS_PROFILE_PATH:-}" ]; then
            rm -f "$IOS_PROFILE_PATH"
          fi
          rm -rf \
            "$RUNNER_TEMP/queenzone-ios-signing" \
            "$RUNNER_TEMP/app-store-connect-private-keys"
