# Non-blocking release notes (issue #2379) and the Glory11 News Agent zip
# (issue #2386). Do not add this workflow to deploy.yml, tip-gate, or CI
# `needs`, and do not make it a required check.
name: Release notes

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Prod tag to backfill (vYYYY.MM.DD.N)
        required: true
        default: v2026.10.22.1
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'release-notes' || format('release-notes-{0}', github.event_name == 'workflow_dispatch' && inputs.tag || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  notes:
    name: Release notes
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      issues: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Publish tag release or refresh Unreleased draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
          DELETE_UNRELEASED: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ] && [ "${{ github.event_name }}" = "push" ]; then
            node scripts/release/generate-notes.mjs draft
          else
            node scripts/release/generate-notes.mjs publish
          fi

      # Tag-push only: workflow_dispatch backfill checks out main, so a zip
      # built there would not match the tag. QueenZone.NewsAgent is a library;
      # publish the worker executable (framework-dependent win-x64).
      - name: Setup .NET
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Publish and attach News Agent zip
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$'; then
            echo "Skipping News Agent zip; $TAG is not a prod tag vYYYY.MM.DD.N."
            exit 0
          fi
          PUBLISH_DIR="${RUNNER_TEMP}/newsagent-publish"
          ZIP_PATH="${RUNNER_TEMP}/newsagent-${TAG}.zip"
          rm -rf "$PUBLISH_DIR"
          mkdir -p "$PUBLISH_DIR"
          dotnet publish src/QueenZone.NewsAgent.Worker/QueenZone.NewsAgent.Worker.csproj \
            --configuration Release \
            --runtime win-x64 \
            --self-contained false \
            --output "$PUBLISH_DIR"
          printf '%s\n' "$TAG" > "$PUBLISH_DIR/version.txt"
          rm -f "$ZIP_PATH"
          (cd "$PUBLISH_DIR" && zip -r "$ZIP_PATH" .)
          gh release upload "$TAG" "$ZIP_PATH" --repo "$GITHUB_REPOSITORY"
