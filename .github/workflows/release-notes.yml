# Non-blocking release notes (issue #2379). Do not add this workflow to
# deploy.yml, tip-gate, or CI `needs`, and do not make it a required check.
name: Release notes

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Prod tag to backfill (vYYYY.MM.DD.N)
        required: true
        default: v2026.10.22.1
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'release-notes' || format('release-notes-{0}', github.event_name == 'workflow_dispatch' && inputs.tag || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  notes:
    name: Release notes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Publish tag release or refresh Unreleased draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
          DELETE_UNRELEASED: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ] && [ "${{ github.event_name }}" = "push" ]; then
            node scripts/release/generate-notes.mjs draft
          else
            node scripts/release/generate-notes.mjs publish
          fi
