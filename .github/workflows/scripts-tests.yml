name: Scripts tests

on:
  pull_request:
  merge_group:
    types: [checks_requested]
    branches: [main]

permissions:
  contents: read

jobs:
  scripts-tests:
    name: Scripts unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Run node:test
        run: node --test $(find scripts -name '*.test.mjs' | sort)

      - name: Validate issue-filer config
        run: node scripts/issue-filer/run.mjs --validate
