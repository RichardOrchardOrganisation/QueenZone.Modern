name: Scripts tests

on:
  pull_request:
  merge_group:
    types: [checks_requested]
    branches: [main]

permissions:
  contents: read

jobs:
  scripts-tests:
    name: Scripts unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch origin/main for allowlist baseline
        run: git fetch origin main --depth=1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Run node:test
        run: node --test $(find scripts -name '*.test.mjs' | sort)

      - name: Test Android app-crash classifier harness
        run: ./scripts/run-mobile-device-smoke.sh --self-test-app-crash

      - name: Test Kudu action contracts without network
        run: python3 scripts/test_kudu_actions.py

      - name: Validate issue-filer config
        run: node scripts/issue-filer/run.mjs --validate

      - name: Guard Web.Tests host construction
        shell: pwsh
        run: |
          pwsh -File ./scripts/Test-WebHostConstruction.ps1 -SelfTest
          pwsh -File ./scripts/Test-WebHostConstruction.ps1
          pwsh -File ./scripts/Get-WebTestShardFilter.ps1 -SelfTest
          pwsh -File ./scripts/Test-OrganizationOidcArguments.ps1
          pwsh -File ./scripts/Test-PowerShellRefactorHelpers.ps1
          pwsh -File ./scripts/Test-SqlPackageRetry.ps1
          pwsh -File ./scripts/Test-CoverageGate.ps1 -SelfTest
          pwsh -File ./scripts/Test-OpenTofuPlanSafety.ps1 -SelfTest
          pwsh -File ./scripts/Get-DevAttachmentEvidence.ps1 -SelfTest

  bitwarden-contract:
    name: Bitwarden output contract (${{ matrix.case }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case: [initial, second, third, all_fail, partial, publication_failure, malformed]
    env:
      BITWARDEN_FIXTURE_CASE: ${{ matrix.case }}
      MOBILE_AUTH_SIGNING_KEY: unchanged-fixture-canary
      FIXTURE_MAPPING: |
        00000000-0000-0000-0000-000000000001 > AZURE_WEBAPP_PUBLISH_PROFILE
        00000000-0000-0000-0000-000000000002 > MOBILE_AUTH_SIGNING_KEY
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Prepare credential-free action fixtures
        run: node scripts/prepare-bitwarden-contract-fixtures.mjs
      - name: Exercise real runner output gates with synthetic results
        id: probe
        continue-on-error: true
        uses: ./.github/actions/bitwarden-contract-fixture
        with:
          access_token: fixture-does-not-connect
          secrets: ${{ matrix.case == 'malformed' && 'invalid mapping' || env.FIXTURE_MAPPING }}
      - name: Assert complete outputs and unchanged global environment
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          PROFILE_RESULT: ${{ steps.probe.outputs.AZURE_WEBAPP_PUBLISH_PROFILE }}
          KEY_RESULT: ${{ steps.probe.outputs.MOBILE_AUTH_SIGNING_KEY }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const expectedFailure = ['all_fail', 'publication_failure', 'malformed'].includes(process.env.BITWARDEN_FIXTURE_CASE);
          assert.equal(process.env.PROBE_OUTCOME, expectedFailure ? 'failure' : 'success');
          assert.equal(process.env.PROFILE_RESULT, expectedFailure ? '' : 'fixture-profile');
          assert.equal(process.env.KEY_RESULT, expectedFailure ? '' : 'fixture-key');
          assert.equal(process.env.MOBILE_AUTH_SIGNING_KEY, 'unchanged-fixture-canary');
          JS
