# Automatic Analysis scope for this repository's SonarQube Cloud
# project (see ADR 0023).
#
# This file is the single source of truth. The project's Analysis Scope
# fields in the Sonar UI are empty — do not also set exclusions or test
# paths there. SonarQube.Analysis.xml and scanner CLI args apply only to
# a CI scan, which this repo does not run.

# Unshipped design prototypes (both design/ and designs/), the offline
# quiz-bank generator, and the
# same test globs as sonar.test.inclusions. Automatic Analysis defaults
# sonar.sources to '.', so those test files must leave the source set
# or Sonar reports "File can't be indexed twice" on the first full
# main scan.
sonar.exclusions=design/**,designs/**,docs/backlog/**,tests/**,src/QueenZone.Mobile/**/*.test.ts,src/QueenZone.Mobile/**/*.test.tsx,src/QueenZone.Mobile/**/__tests__/**,src/QueenZone.Mobile/src/test/**,src/QueenZone.Mobile/jest.setup.ts

# .NET test projects live under tests/. Mobile tests are colocated
# *.test.ts / *.test.tsx files, plus src/test fixtures, jest.setup.ts,
# and a possible future __tests__/ tree.
sonar.tests=tests,src/QueenZone.Mobile
sonar.test.inclusions=tests/**,src/QueenZone.Mobile/**/*.test.ts,src/QueenZone.Mobile/**/*.test.tsx,src/QueenZone.Mobile/**/__tests__/**,src/QueenZone.Mobile/src/test/**,src/QueenZone.Mobile/jest.setup.ts
