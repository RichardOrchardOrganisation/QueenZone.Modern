appId: org.queenzone.mobile
---
# Release-embedded smoke binaries bake JS and skip the expo-dev-client launcher (#1322).
# After launch the QueenZone home testID must be visible on the Testing host.
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 45000
- scrollUntilVisible:
    element:
      id: home-hero
    direction: DOWN
- extendedWaitUntil:
    visible:
      id: home-hero
    timeout: 30000
# Reserved non-prod bar (#1407). Smoke embeds show it; assert via env-banner
# so it cannot collide with home-screen / home-hero / home-profile.
- extendedWaitUntil:
    visible:
      id: env-banner
    timeout: 10000
