appId: org.queenzone.mobile
---
- tapOn:
    id: tab-photos
- extendedWaitUntil:
    visible:
      id: photos-screen
    timeout: 20000
- tapOn:
    id: photo-category-brian-may
- extendedWaitUntil:
    visible:
      id: photo-category-screen
    timeout: 20000
- tapOn:
    id: photo-item-101
- extendedWaitUntil:
    visible:
      id: photo-viewer-screen
    timeout: 20000
# Wallpaper lives in viewer chrome beside Save (#1409 Option A). Assert the
# control is present; do not tap it (iOS saves, Android opens a target sheet).
- extendedWaitUntil:
    visible:
      id: photo-viewer-wallpaper
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: photo-viewer-save
    timeout: 5000
- takeScreenshot: photo-viewer-controls-proof
# PhotoViewer hides the tab bar (navigation/visibility.ts) — leave via its
# own close control, same pattern as 08-profile-signed-out.yaml's profile-back.
# Close pops back to the category, not the tab root.
- tapOn:
    id: photo-viewer-close
- extendedWaitUntil:
    visible:
      id: photo-category-screen
    timeout: 15000
