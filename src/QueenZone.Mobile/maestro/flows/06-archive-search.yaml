appId: org.queenzone.mobile
---
- tapOn:
    id: tab-archive
- extendedWaitUntil:
    visible:
      id: archive-hub-screen
    timeout: 15000
- tapOn:
    id: tab-home
- tapOn:
    id: home-search
- extendedWaitUntil:
    visible:
      id: search-screen
    timeout: 15000
- tapOn:
    id: search-input
- inputText: modernisation
# iOS XCTest can leave a controlled TextInput uncommitted until the search
# return key flushes native text. Enter starts SearchScreen's 300ms
# committedQuery path (and onSubmitEditing). hideKeyboard alone does not.
- runFlow:
    when:
      platform: iOS
    commands:
      - pressKey: Enter
- hideKeyboard
# Hosted Simulator can briefly starve the loopback Testing host while
# XCTest is active. Retry only the screen's read-only recovery action; a
# selector miss or a second request failure still fails the flow.
- retry:
    maxRetries: 1
    commands:
      - runFlow:
          when:
            visible:
              text: '^Try again$'
          commands:
            - tapOn:
                text: '^Try again$'
      - extendedWaitUntil:
          visible:
            id: search-results
          timeout: 20000
      - extendedWaitUntil:
          visible:
            id: search-result-news-1003
          timeout: 20000
- tapOn:
    id: search-result-news-1003
- extendedWaitUntil:
    visible:
      id: news-story-screen
    timeout: 20000
# Search opens news results on the News tab. The story hides the tab bar, so
# leave through its header before 07-forum tries to switch tabs.
- tapOn:
    id: news-story-back
- extendedWaitUntil:
    visible:
      id: news-screen
    timeout: 15000
# Cross-tab navigation preserves Search on the Home stack. Restore the Home
# root so later flows do not inherit the hidden-tab Search detail screen.
- tapOn:
    id: tab-home
- extendedWaitUntil:
    visible:
      id: search-screen
    timeout: 15000
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: '^Home$'
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 15000
