appId: org.queenzone.mobile
---
# Forum tab-root identity header (not the Home masthead). Badge is GET /api/v1/me/messages/unread-count only (#1074).
- tapOn:
    id: tab-forum
- extendedWaitUntil:
    visible:
      id: forum-screen
    timeout: 20000
# Home can retain the hero's scroll position after the detail flow. Authenticate
# from Forum's fixed header so the helper can see home-messages on small phones.
- runFlow: open-smoke-auth.yaml
- assertNotVisible:
    id: tab-masthead
- extendedWaitUntil:
    visible:
      id: home-messages
    timeout: 20000
- extendedWaitUntil:
    visible: Messages, 1 unread conversations
    timeout: 20000
- tapOn:
    id: home-messages
- extendedWaitUntil:
    visible:
      id: inbox-screen
    timeout: 20000
- assertNotVisible:
    id: member-gate
- assertVisible:
    # iOS merges the conversation preview and unread count into one AX label.
    text: '^Contract Other.*'
