appId: org.queenzone.mobile
---
# Forum tab-root identity header (not the Home masthead). Badge is GET /api/v1/me/messages/unread-count only (#1074).
# Scroll Home back to the masthead before smoke-auth so home-messages is on-screen (#2457).
# Replaces the earlier forum-first auth workaround from daad5ec0.
- runFlow: common/home-top.yaml
- runFlow: open-smoke-auth.yaml
- tapOn:
    id: tab-forum
- extendedWaitUntil:
    visible:
      id: forum-screen
    timeout: 20000
- assertNotVisible:
    id: tab-masthead
- extendedWaitUntil:
    visible:
      id: home-messages
    timeout: 20000
- extendedWaitUntil:
    visible: Messages, 1 unread conversations
    timeout: 20000
- tapOn:
    id: home-messages
- extendedWaitUntil:
    visible:
      id: inbox-screen
    timeout: 20000
- assertNotVisible:
    id: member-gate
- assertVisible:
    # iOS merges the conversation preview and unread count into one AX label.
    text: '^Contract Other.*'
