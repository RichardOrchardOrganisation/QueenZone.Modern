# This proves card/load/fallback UI only; the native manual matrix remains required.
- tapOn:
    id: tab-forum
- tapOn:
    id: forum-board-1
- scrollUntilVisible:
    element:
      id: forum-thread-1030
    direction: DOWN
    timeout: 30000
- tapOn:
    id: forum-thread-1030
- extendedWaitUntil:
    visible:
      id: forum-thread-screen
    timeout: 20000
- assertVisible: Before the shared video.
- assertVisible: Original video
- assertVisible: Watch on YouTube
- extendedWaitUntil:
    visible: Ready. Press the YouTube Play control to play.
    timeout: 20000
- takeScreenshot: forum-youtube-autoload-before-play
# Actual YouTube Play/fullscreen controls differ by OS/provider. Follow manual
# proof matrix; never use a synthetic bridge state as native playback proof.
- tapOn:
    id: forum-thread-back
