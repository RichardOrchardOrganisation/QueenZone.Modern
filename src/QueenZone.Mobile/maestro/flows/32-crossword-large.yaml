appId: org.queenzone.mobile
---
- launchApp
- runFlow:
    file: open-crossword-deep-link.yaml
    env:
      CROSSWORD_DEEP_LINK: queenzone://crosswords/studios-and-collaborators
- swipe:
    start: "50%,42%"
    end: "50%,28%"
    duration: 500
- swipe:
    start: "50%,42%"
    end: "50%,28%"
    duration: 500
- scrollUntilVisible:
    element:
      id: crossword-cell-203
    direction: DOWN
- tapOn:
    id: crossword-cell-203
- assertVisible:
    text: "(?i)12 across:.*"
- tapOn: Zoom in
- tapOn: Zoom in
- assertVisible:
    id: crossword-cell-203
- takeScreenshot: crossword-large-selected
- tapOn: Fit grid
- takeScreenshot: crossword-large-fitted
