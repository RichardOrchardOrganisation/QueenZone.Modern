appId: org.queenzone.mobile
---
- tapOn:
    id: tab-home
- tapOn:
    id: home-profile
- scrollUntilVisible:
    element:
      text: Appearance
    direction: DOWN
- tapOn: Appearance
- tapOn: Dark
- runFlow:
    file: open-crossword-deep-link.yaml
    env:
      CROSSWORD_DEEP_LINK: queenzone://crosswords/meet-the-band
- takeScreenshot: crossword-dark
- tapOn:
    id: tab-home
- tapOn: Light
- runFlow:
    file: open-crossword-deep-link.yaml
    env:
      CROSSWORD_DEEP_LINK: queenzone://crosswords/meet-the-band
- takeScreenshot: crossword-light-repeated-link
