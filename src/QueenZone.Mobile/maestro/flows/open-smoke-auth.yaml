appId: org.queenzone.mobile
---
# Inject the Testing fixture token. Caller must already show chrome so
# SessionProvider (Linking) is mounted — App.tsx BootSplash keeps it off
# until after 'booting'. Fresh-install iOS still shows the Open confirm,
# and that sheet can land several seconds after openLink returns (#1455).
- openLink: ${SMOKE_AUTH_URL}
- runFlow: accept-ios-open-link.yaml
# iOS can accept the system Open prompt without delivering the first
# foreground URL event. Retry once when the signed-in masthead affordance did
# not appear. Hosted iOS 26 simulators can show another Open confirmation for
# that retry, so dismiss it before waiting for the signed-in affordance (#1281).
- runFlow:
    when:
      platform: iOS
      notVisible:
        id: home-messages
    commands:
      - openLink: ${SMOKE_AUTH_URL}
      - runFlow: accept-ios-open-link.yaml
- extendedWaitUntil:
    visible:
      id: home-messages
    timeout: 20000
